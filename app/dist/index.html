<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manda Vaga</title>
<meta name="description" content="Manda Vaga — currículo, curadoria de vagas e acompanhamento de candidaturas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — dark green rail + light work surface; public landing reuses tokens */
:root{
  --deep:#0d2c20; --deep-2:#173d2e; --rail-ink:#c7d7cd; --lime:#d9f36a; --lime-ink:#0d2c20;
  --green:#145c42; --green-soft:#e6f1ea; --paper:#f4f6f1; --surface:#ffffff; --surface-2:#f8faf6;
  --ink:#15251d; --muted:#5c6b63; --line:#dde5dc; --line-strong:#c6d2c7;
  --ok:#1d7a4f; --ok-bg:#e3f3ea; --warn:#8a5600; --warn-bg:#fff2d9; --bad:#a3302b; --bad-bg:#fde9e7; --info:#24508f; --info-bg:#e8f0fc;
  --demo:#6a4bb5; --demo-bg:#efe9fb;
  --shadow:0 1px 2px rgba(13,44,32,.06),0 6px 24px rgba(13,44,32,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --deep:#081d15; --deep-2:#12352a; --rail-ink:#b4c8bb; --lime:#d4ef63; --lime-ink:#0b2419;
  --green:#7fd1a5; --green-soft:#16352a; --paper:#0e1713; --surface:#14201a; --surface-2:#18261f;
  --ink:#e4ece6; --muted:#9aaba1; --line:#26362e; --line-strong:#35493e;
  --ok:#7fd1a5; --ok-bg:#163a2a; --warn:#f0c46b; --warn-bg:#3a2d12; --bad:#f09a92; --bad-bg:#3f1c1a; --info:#9cc0f5; --info-bg:#172a45;
  --demo:#c3aef3; --demo-bg:#2a2140; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --deep:#081d15; --deep-2:#12352a; --rail-ink:#b4c8bb; --lime:#d4ef63; --lime-ink:#0b2419;
  --green:#7fd1a5; --green-soft:#16352a; --paper:#0e1713; --surface:#14201a; --surface-2:#18261f;
  --ink:#e4ece6; --muted:#9aaba1; --line:#26362e; --line-strong:#35493e;
  --ok:#7fd1a5; --ok-bg:#163a2a; --warn:#f0c46b; --warn-bg:#3a2d12; --bad:#f09a92; --bad-bg:#3f1c1a; --info:#9cc0f5; --info-bg:#172a45;
  --demo:#c3aef3; --demo-bg:#2a2140; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--deep)}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,2.6vw,32px);line-height:1.15}
h2{font-size:19px;line-height:1.25}
h3{font-size:15.5px;line-height:1.3}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--green)}
.stack{display:grid;gap:12px;align-content:start}.stack-sm{display:grid;gap:6px;align-content:start}.stack-lg{display:grid;gap:20px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hidden{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--deep);color:var(--rail-ink);padding:22px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font:800 19px/1 var(--f-display);letter-spacing:-.03em;padding:2px 6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font:800 14px/1 var(--f-display)}
.brand small{display:block;font:500 11px/1.3 var(--f-body);color:var(--rail-ink);letter-spacing:0;margin-top:3px}
.nav{display:grid;gap:2px}
.nav-label{font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--rail-ink) 70%,transparent);padding:12px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--rail-ink);font-weight:600;font-size:14px}
.nav button:hover{background:var(--deep-2);color:#fff}
.nav button.active{background:var(--deep-2);color:#fff;box-shadow:inset 3px 0 0 var(--lime)}
.nav button:focus-visible{outline:2px solid var(--lime)}
.nav .ico{width:18px;text-align:center;opacity:.85}
.nav .badge{margin-left:auto;background:var(--lime);color:var(--lime-ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;display:grid;gap:10px;font-size:12px}
.rail-user{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--deep-2);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rail-user .who{min-width:0}.rail-user .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rail-user .who span{color:var(--rail-ink);font-size:11.5px}
.rail-btn{all:unset;cursor:pointer;color:var(--rail-ink);font-size:12.5px;padding:6px 10px;border-radius:8px}
.rail-btn:hover{background:var(--deep-2);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:60px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar .crumb{font:700 15px/1.2 var(--f-display);min-width:0}
.topbar .spacer{flex:1}
.topbar .menu-btn{display:none}
.content{width:100%;max-width:1240px;margin:0 auto;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.page-head .lead{max-width:68ch;color:var(--muted);margin-top:6px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.pad-lg{padding:22px}
.card-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.sunken{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.divider{height:1px;background:var(--line);margin:4px 0}

/* stat tiles */
.stat{display:grid;gap:4px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font:800 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .s{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}
:root:not([data-theme="light"]) .btn-primary{color:var(--paper)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
:root[data-theme="light"] .btn-primary{color:#fff}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-soft{background:var(--green-soft);color:var(--green)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-link{background:none;border:0;padding:0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn:hover:not([disabled]){filter:brightness(.97)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:700;line-height:1.3;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.pill.demo{background:var(--demo-bg);color:var(--demo);border-color:transparent}
.pill.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}

/* forms */
.field{display:grid;gap:5px;min-width:0}
.field>label,.label{font-size:12.5px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;min-width:0}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px;flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface)}
.tags .tag{display:inline-flex;gap:6px;align-items:center;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12.5px;border-radius:7px;padding:3px 4px 3px 9px}
.tags .tag button{border:0;background:none;color:inherit;padding:0 4px;font-size:14px;line-height:1}
.tags input{border:0;outline:0;flex:1;min-width:140px;background:transparent;padding:4px}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* meters / bars */
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter.warn>span{background:var(--warn)}
.meter.bad>span{background:var(--bad)}
.score{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;flex:none;font:800 17px/1 var(--f-display);font-variant-numeric:tabular-nums;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);position:relative}
.score::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.score span{position:relative}
.dim{display:grid;grid-template-columns:120px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:12.5px}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar-row .fill{height:100%;background:var(--green);border-radius:3px 0 0 3px}
.bar-row .fill.missing{background:repeating-linear-gradient(45deg,var(--line-strong) 0 4px,transparent 4px 8px)}

/* job cards */
.job{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.job+.job{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.job-title{font:700 16px/1.3 var(--f-display)}
.job-meta{font-size:13px;color:var(--muted)}
.job-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.details{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}

/* notices */
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 13px;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2)}
.notice.info{background:var(--info-bg);border-color:transparent;color:var(--ink)}
.notice.warn{background:var(--warn-bg);border-color:transparent}
.notice.bad{background:var(--bad-bg);border-color:transparent}
.notice.ok{background:var(--ok-bg);border-color:transparent}
.notice.demo{background:var(--demo-bg);border-color:transparent}
.notice .ic{font-weight:800;flex:none}

/* checklist */
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--line-strong)}
.step.done .n{background:var(--green);color:var(--surface);border-color:transparent}

/* diff */
.diff{font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:440px;background:var(--surface)}
.diff div{padding:0 10px}
.diff .add{background:var(--ok-bg)}
.diff .del{background:var(--bad-bg);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.preview-text{font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:460px;overflow:auto;margin:0}

/* timeline */
.timeline{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.timeline .t{position:relative;font-size:13px}
.timeline .t::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}

/* kanban-ish columns */
.cols{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.app-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:pointer;text-align:left}
.app-card:hover{border-color:var(--green)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,20,14,.5);z-index:80;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.modal.wide{width:min(920px,100%)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* toast */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--deep);color:#fff;border-radius:12px;padding:12px 15px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:4px solid var(--lime)}
.toast.bad{border-left-color:#f09a92}

/* empty */
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

/* auth + landing */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:var(--deep);color:var(--rail-ink);padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:24px;justify-content:space-between}
.auth-side h2{color:#fff;font-size:clamp(26px,3vw,38px);line-height:1.1}
.auth-side em{font-style:normal;color:var(--lime)}
.auth-main{display:grid;place-items:center;padding-block:32px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-box{width:min(440px,100%);display:grid;gap:16px}
.landing{background:var(--paper)}
.l-hero{background:var(--deep);color:var(--rail-ink)}
.l-wrap{max-width:1160px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.l-nav{display:flex;align-items:center;gap:16px;padding-block:20px}
.l-hero-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:40px 64px}
.l-hero h1{color:#fff;font-size:clamp(34px,5vw,58px);line-height:1.03;letter-spacing:-.04em}
.l-hero h1 em{font-style:normal;color:var(--lime)}
.l-hero .lead{font-size:18px;max-width:52ch;margin-top:16px;color:var(--rail-ink)}
.l-panel{background:var(--deep-2);border-radius:18px;padding:18px;display:grid;gap:10px;border:1px solid rgba(255,255,255,.08)}
.l-panel .row-between{color:#fff}
.l-sec{padding-block:56px}
.l-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.l-step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:8px}
.l-step .n{font:800 13px/1 var(--f-mono);color:var(--green)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

<script>
"use strict";
/* =====================================================================
   CAMADA 0 — utilidades
   ===================================================================== */
const U = {
  uid(p = "id") { const r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0, 13) : Math.random().toString(36).slice(2, 15); return p + "_" + r.replace(/-/g, ""); },
  now() { return new Date().toISOString(); },
  today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); },
  month(iso) { return (iso || U.now()).slice(0, 7); },
  daysAgo(n) { return new Date(Date.now() - n * 864e5).toISOString(); },
  daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); },
  esc(s) { return String(s ?? "").replace(/[&<>"'`]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" }[c])); },
  norm(s) { return String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); },
  fmtDate(s) { if (!s) return "—"; const d = new Date(String(s).length <= 10 ? s + "T12:00:00" : s); return isNaN(+d) ? "—" : d.toLocaleDateString("pt-BR"); },
  fmtDateTime(s) { if (!s) return "—"; const d = new Date(s); return isNaN(+d) ? "—" : d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); },
  rel(s) { if (!s) return "—"; const d = U.daysBetween(s, U.now()); if (d <= 0) return "hoje"; if (d === 1) return "ontem"; if (d < 30) return `há ${d} dias`; return U.fmtDate(s); },
  money(v) { return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); },
  safeUrl(u) { try { const x = new URL(String(u || "").trim()); return ["http:", "https:"].includes(x.protocol) ? x.href : ""; } catch (e) { return ""; } },
  canonicalUrl(u) { try { const x = new URL(u); x.hash = ""; [...x.searchParams.keys()].forEach(k => { if (/^(utm_|fbclid|gclid|ref|refid|trk|trackingid|src|jobboardsource)/i.test(k)) x.searchParams.delete(k); }); x.hostname = x.hostname.toLowerCase().replace(/^www\./, ""); return x.toString().replace(/\/(\?|$)/, "$1").toLowerCase(); } catch (e) { return U.norm(u).trim(); } },
  words(s) { return U.norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2); },
  jaccard(a, b) { const A = new Set(U.words(a)), B = new Set(U.words(b)); if (!A.size || !B.size) return 0; let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return i / (A.size + B.size - i); },
  initials(n) { return String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase(); },
  clamp(n, a, b) { return Math.max(a, Math.min(b, n)); },
  slug(s) { return U.norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "arquivo"; },
  async hash(text) {
    try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
    catch (e) { let h = 5381; for (const c of text) h = (h * 33) ^ c.charCodeAt(0); return "fallback_" + (h >>> 0).toString(16); }
  },
  pct(a, b) { return b ? Math.round(a / b * 100) : 0; },
};

/* =====================================================================
   CAMADA 1 — repositório de dados (contratos estáveis)
   O adaptador local guarda tudo no navegador. Um adaptador Supabase
   futuro implementa os mesmos métodos: all/get/find/insert/update/remove.
   ===================================================================== */
const COLLECTIONS = ["users", "profiles", "resumes", "resume_versions", "keyword_claims", "job_sources", "jobs", "job_feedback", "applications", "subscriptions", "usage_events", "content_drafts", "notifications", "notification_preferences", "audit_events", "privacy_requests", "settings"];
const DB_KEY = "mandavaga_saas_v1";

const LocalAdapter = {
  name: "Armazenamento local do navegador",
  ok: true,
  read() { try { const raw = localStorage.getItem(DB_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { this.ok = false; return null; } },
  write(data) { try { localStorage.setItem(DB_KEY, JSON.stringify(data)); return true; } catch (e) { this.ok = false; return false; } },
  clear() { try { localStorage.removeItem(DB_KEY); } catch (e) { } },
};

const Repo = {
  data: null,
  adapter: LocalAdapter,
  load() {
    const d = this.adapter.read();
    this.data = d && d.schema === 1 ? d : null;
    if (this.data) COLLECTIONS.forEach(c => { if (!Array.isArray(this.data[c])) this.data[c] = []; });
    return !!this.data;
  },
  init(seed) { this.data = Object.assign({ schema: 1, createdAt: U.now() }, seed); COLLECTIONS.forEach(c => { if (!Array.isArray(this.data[c])) this.data[c] = []; }); this.save(); },
  save() { this.adapter.write(this.data); },
  all(c) { return this.data[c]; },
  get(c, id) { return this.data[c].find(r => r.id === id) || null; },
  find(c, fn) { return this.data[c].filter(fn); },
  one(c, fn) { return this.data[c].find(fn) || null; },
  insert(c, rec) { const r = Object.assign({ id: U.uid(c.slice(0, 3)), createdAt: U.now() }, rec); this.data[c].push(r); this.save(); return r; },
  update(c, id, patch) { const r = this.get(c, id); if (!r) return null; Object.assign(r, patch, { updatedAt: U.now() }); this.save(); return r; },
  remove(c, fn) { const before = this.data[c].length; this.data[c] = this.data[c].filter(r => !fn(r)); this.save(); return before - this.data[c].length; },
  setting(key, def) { const s = this.one("settings", r => r.key === key); return s ? s.value : def; },
  setSetting(key, value) { const s = this.one("settings", r => r.key === key); if (s) { s.value = value; this.save(); } else this.insert("settings", { key, value }); },
};

/* =====================================================================
   CAMADA 2 — adaptadores de integração (todos desconectados nesta fase)
   Cada um responde { ok:false, reason } até ser configurado no servidor.
   ===================================================================== */

    { key: "jobs", name: "Fontes autorizadas de vagas", example: "APIs e parceiros com termos de uso", phase: "Fase 11", detail: "Hoje: catálogo demonstrativo + vagas reais cadastradas à mão pelo admin." },
    { key: "email", name: "E-mail transacional", example: "Provedor de e-mail", phase: "Fase 11", detail: "Recuperação de senha, alertas de vagas e Central de Respostas." },

    { key: "files", name: "Leitura de PDF/DOCX", example: "Extração no servidor", phase: "Fase 11", detail: "Hoje: preenchimento manual, colar texto ou enviar .txt." },
    { key: "hosting", name: "Hospedagem, domínio e monitoramento", example: "Vercel ou Hostinger", phase: "Fase 11", detail: "Logs, alertas e backups." },
  ],

/* =====================================================================

  const n = " " + U.norm(text).replace(/[^a-z0-9@.+-]+/g, " ") + " ";

  toText(d, user, opts = {}) {

    if ((d.certifications || []).length) sec("CERTIFICAÇÕES E CURSOS", d.certifications.map(c => "• " + c).join("\n"));

  },
  toHTML(d, user, opts = {}) {

  period(e) { return `${e.start || "?"}–${e.end || "atual"}`; },
  year(v) { const m = String(v || "").match(/(19|20)\d{2}/); return m ? +m[0] : null; },
  isCurrent(v) { return !v || /atual|presente|hoje|current/i.test(v); },

  /* Importação de texto colado ou .txt: heurística por títulos de seção */
  parseText(raw) {
    const d = Resume.empty();
    const lines = String(raw || "").replace(/\r/g, "").split("\n").map(l => l.trim());
    const H = [["summary", /^(resumo|perfil|sobre|objetivo)/i], ["experiences", /^(experi[eê]ncia|hist[oó]rico profissional|atua[cç][aã]o)/i], ["education", /^(forma[cç][aã]o|escolaridade|educa[cç][aã]o)/i], ["skills", /^(compet[eê]ncias|habilidades|conhecimentos|skills)/i], ["certifications", /^(certifica|cursos)/i], ["languages", /^(idiomas|l[ií]nguas)/i], ["extra", /^(informa[cç][oõ]es adicionais|outras informa)/i]];
    let sec = "header", cur = null; const summary = [], extra = [];
    for (const line of lines) {
      if (!line) continue;
      const h = H.find(([, re]) => re.test(line) && line.length < 60);
      if (h) { sec = h[0]; cur = null; continue; }
      const bullet = /^[•\-–*·]\s*/.test(line); const clean = line.replace(/^[•\-–*·]\s*/, "");
      if (sec === "summary") summary.push(clean);
      else if (sec === "experiences") {
        const yr = clean.match(/((?:19|20)\d{2})\s*(?:[–—-]|a|até)\s*((?:19|20)\d{2}|atual|presente)?/i);
        if (!bullet && (yr || /[—|]/.test(clean))) {
          const head = clean.replace(/\|?\s*((?:19|20)\d{2}).*$/, "").trim();
          const parts = head.split(/\s+[—–-]\s+|\s*\|\s*/).filter(Boolean);
          cur = { id: U.uid("exp"), org: parts[0] || head, role: parts[1] || "Cargo a confirmar", start: yr ? yr[1] : "", end: yr && yr[2] && !/atual|presente/i.test(yr[2]) ? yr[2] : (yr ? "atual" : ""), activities: [] };
          d.experiences.push(cur);
        } else if (cur) cur.activities.push(clean);
        else extra.push(clean);
      }
      else if (sec === "education") { const parts = clean.split(/\s+[—–-]\s+/); const yr = clean.match(/(19|20)\d{2}/); d.education.push({ id: U.uid("edu"), course: parts[0], institution: (parts[1] || "").replace(/,?\s*(19|20)\d{2}.*$/, "").trim() || "Instituição a confirmar", status: /andamento|cursando/i.test(clean) ? "em andamento" : "concluído", end: yr ? yr[0] : "" }); }
      else if (sec === "skills") clean.split(/\s*[•;,]\s*/).filter(Boolean).forEach(s => d.skills.push(s));
      else if (sec === "certifications") d.certifications.push(clean);
      else if (sec === "languages") { const [lang, level] = clean.split(/\s*[—–:-]\s*/); d.languages.push({ lang, level: level || "nível a confirmar" }); }
      else if (sec === "extra") extra.push(clean);
    }
    d.summary = summary.join(" ");
    d.extra = extra.join(" ");
    d.skills = [...new Set(d.skills)];
    return d;
  },

  /* Diagnóstico explicável — cada item diz o porquê */
  analyze(d) {
    const items = [];
    const add = (id, label, status, detail) => items.push({ id, label, status, detail });
    const missing = [["summary", "resumo"], ["experiences", "experiência"], ["education", "formação"], ["skills", "competências"]].filter(([k]) => !(Array.isArray(d[k]) ? d[k].length : (d[k] || "").trim()));
    add("sections", "Seções essenciais", missing.length ? "fail" : "pass", missing.length ? `Faltam: ${missing.map(m => m[1]).join(", ")}.` : "Resumo, experiência, formação e competências presentes.");
    const sl = (d.summary || "").length;
    add("summary", "Tamanho do resumo", sl === 0 ? "fail" : sl < 200 ? "warn" : sl > 750 ? "warn" : "pass", sl === 0 ? "Sem resumo." : sl < 200 ? `${sl} caracteres. Um resumo entre 200 e 750 caracteres explica melhor quem você é.` : sl > 750 ? `${sl} caracteres. Recrutadores leem os primeiros segundos; tente até 750.` : `${sl} caracteres: bom tamanho.`);
    const badDates = (d.experiences || []).filter(e => { const s = Resume.year(e.start), f = Resume.isCurrent(e.end) ? new Date().getFullYear() : Resume.year(e.end); return !s || !f || f < s || s > new Date().getFullYear(); });
    add("dates", "Datas das experiências", (d.experiences || []).length === 0 ? "warn" : badDates.length ? "fail" : "pass", badDates.length ? `Verifique: ${badDates.map(e => e.org).join(", ")} (início ausente ou fim antes do início).` : "Todas as experiências têm período coerente.");
    const thin = (d.experiences || []).filter(e => (e.activities || []).length < 2);
    add("activities", "Atividades por experiência", (d.experiences || []).length === 0 ? "warn" : thin.length ? "warn" : "pass", thin.length ? `Com menos de 2 atividades: ${thin.map(e => e.org).join(", ")}.` : "Cada experiência descreve ao menos 2 atividades.");
    const weak = []; (d.experiences || []).forEach(e => (e.activities || []).forEach(a => { if (/^(respons[aá]vel (por|pela|pelo)|fui respons|eu )/i.test(a)) weak.push(a); }));
    add("verbs", "Atividades começam pela ação", weak.length ? "warn" : "pass", weak.length ? `${weak.length} atividade(s) começam com “Responsável por” ou “Eu”. Começar pela ação deixa a leitura mais rápida.` : "Atividades começam pela ação.");
    const years = (d.experiences || []).map(e => Resume.year(e.start)).filter(Boolean);
    const first = years.length ? Math.min(...years) : null; const span = first ? new Date().getFullYear() - first : 0;
    const claims = [...String((d.summary || "") + " " + (d.headline || "")).matchAll(/mais de\s+(\d{1,2})\s+anos/gi)].map(m => +m[1]);
    const over = claims.filter(n => !first || n > span);
    add("integrity", "Tempo de experiência declarado", over.length ? "fail" : "pass", over.length ? `O texto diz “mais de ${over[0]} anos”, mas a experiência mais antiga registrada é de ${first || "—"} (cerca de ${span} anos). Ajuste o texto ou inclua a experiência que comprova.` : claims.length ? "O tempo declarado é compatível com as datas." : "Nenhuma afirmação de tempo sem data.");
    const nums = []; (d.experiences || []).forEach(e => (e.activities || []).forEach(a => { if (/\d+\s?%|\bR\$\s?\d|\b\d{2,}\b(?!\s*(?:19|20)\d{2})/.test(a)) nums.push(a); }));
    add("numbers", "Resultados numéricos", nums.length ? "info" : "pass", nums.length ? `${nums.length} atividade(s) citam números. Mantenha só os que você consegue comprovar numa entrevista.` : "Nenhum número a comprovar.");
    const sk = d.skills || []; const dup = sk.filter((s, i) => sk.findIndex(x => U.norm(x) === U.norm(s)) !== i);
    add("skills", "Lista de competências", sk.length === 0 ? "fail" : dup.length ? "warn" : sk.length < 5 ? "warn" : sk.length > 25 ? "warn" : "pass", sk.length === 0 ? "Sem competências." : dup.length ? `Repetidas: ${[...new Set(dup)].join(", ")}.` : sk.length < 5 ? `${sk.length} competências. Entre 5 e 25 dá contexto sem poluir.` : sk.length > 25 ? `${sk.length} competências. Acima de 25 parece lista de palavras-chave.` : `${sk.length} competências.`);
    const all = Resume.toText(d, {});
    const freq = {}; U.words(all).filter(w => w.length > 5).forEach(w => freq[w] = (freq[w] || 0) + 1);
    const rep = Object.entries(freq).filter(([, n]) => n > 6).map(([w]) => w);
    add("repetition", "Repetição de palavras", rep.length ? "warn" : "pass", rep.length ? `Muito repetidas: ${rep.slice(0, 5).join(", ")}. Repetição artificial é penalizada por recrutadores.` : "Sem repetição excessiva.");
    const emoji = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(all);
    add("ats", "Legível por sistemas de recrutamento", emoji ? "warn" : "pass", emoji ? "Há emojis ou símbolos especiais; alguns sistemas não leem." : "Texto simples, sem tabelas, imagens ou emojis.");
    const scoreable = items.filter(i => i.status !== "info");
    const score = Math.round(scoreable.reduce((s, i) => s + (i.status === "pass" ? 1 : i.status === "warn" ? .5 : 0), 0) / scoreable.length * 100);
    return { items, score };
  },

  /* Sugestões editoriais: sempre antes/depois/motivo, nunca criam fatos */
  suggestions(d) {
    const out = [];
    const push = (path, label, before, after, reason) => { if (before !== after) out.push({ id: path + ":" + U.norm(before).slice(0, 40), path, label, before, after, reason }); };
    const first = Math.min(...(d.experiences || []).map(e => Resume.year(e.start)).filter(Boolean));
    if (isFinite(first) && d.summary) {
      const span = new Date().getFullYear() - first;
      const fixed = d.summary.replace(/(com\s+)?mais de\s+(\d{1,2})\s+anos de experi[eê]ncia(\s+profissional)?/gi, (m, com, n) => +n > span ? `${com || ""}experiência profissional desde ${first}` : m);
      push("summary", "Resumo", d.summary, fixed, `Integridade: a afirmação de tempo não fecha com as datas (experiência mais antiga: ${first}).`);
    }
    if (d.summary && /\s{2,}|\s+[,.]/.test(d.summary)) push("summary", "Resumo", d.summary, d.summary.replace(/\s{2,}/g, " ").replace(/\s+([,.])/g, "$1"), "Espaços e pontuação.");
    (d.experiences || []).forEach((e, ei) => {
      (e.activities || []).forEach((a, ai) => {
        let n = a.replace(/^(eu\s+)?(fui\s+)?respons[aá]vel\s+(por|pela|pelo)\s+/i, "");
        if (n !== a) { n = n.charAt(0).toUpperCase() + n.slice(1); push(`experiences.${ei}.activities.${ai}`, `${e.org}: atividade`, a, n, "Começar pela ação deixa a atividade mais direta. O conteúdo não muda."); }
        else if (/[a-zà-ú]$/.test(a.trim()) === false && /\.$/.test(a.trim())) push(`experiences.${ei}.activities.${ai}`, `${e.org}: atividade`, a, a.trim().replace(/\.$/, ""), "Itens de lista não precisam de ponto final; deixa o padrão uniforme.");
      });
      if (e.end && /^(atual|presente|hoje)$/i.test(e.end) && e.end !== "atual") push(`experiences.${ei}.end`, `${e.org}: período`, e.end, "atual", "Padronizar o período.");
    });
    const sk = d.skills || [];
    const dedup = sk.filter((s, i) => sk.findIndex(x => U.norm(x) === U.norm(s)) === i);
    if (dedup.length !== sk.length) push("skills", "Competências", sk.join(" • "), dedup.join(" • "), "Remover competências repetidas.");
    return out;
  },
  applySuggestion(d, s) {
    const c = JSON.parse(JSON.stringify(d));
    if (s.path === "summary") c.summary = s.after;
    else if (s.path === "skills") c.skills = s.after.split(" • ").filter(Boolean);
    else { const p = s.path.split("."); let o = c; for (let i = 0; i < p.length - 1; i++) o = o[isNaN(p[i]) ? p[i] : +p[i]]; o[isNaN(p.at(-1)) ? p.at(-1) : +p.at(-1)] = s.after; }
    return c;
  },
  /* Versão direcionada: só reordena e destaca o que já existe */
  tailor(d, job) {
    const c = JSON.parse(JSON.stringify(d));
    const jt = Keywords.jobTerms(job).map(t => t.term);
    const rel = text => TAXONOMY.filter(t => jt.includes(t.term) && termIn(text, t)).length;
    const changes = [];
    const beforeSkills = c.skills.join(" • ");
    c.skills = [...c.skills].sort((a, b) => rel(b) - rel(a));
    if (c.skills.join(" • ") !== beforeSkills) changes.push({ field: "Competências", before: beforeSkills, after: c.skills.join(" • "), reason: "Competências ligadas aos requisitos da vaga vêm primeiro." });
    c.experiences.forEach(e => { const b = e.activities.join(" | "); e.activities = [...e.activities].sort((x, y) => rel(y) - rel(x)); if (e.activities.join(" | ") !== b) changes.push({ field: `${e.org}: atividades`, before: b, after: e.activities.join(" | "), reason: "Atividades relacionadas à vaga vêm primeiro dentro da mesma experiência." }); });
    changes.push({ field: "Objetivo", before: c.headline || "(vazio)", after: `${job.title}`, reason: "Título alinhado ao cargo anunciado. Nenhuma experiência, data ou competência foi criada." });
    return { data: c, objective: job.title, changes };
  },
  diffLines(a, b) {
    const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) { if (A[i] === B[j]) { out.push(["=", A[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(["-", A[i++]]); else out.push(["+", B[j++]]); }
    while (i < n) out.push(["-", A[i++]]); while (j < m) out.push(["+", B[j++]]);
    return out;
  },
};

/* ---------------- motor de palavras-chave ---------------- */
const Keywords = {
  jobTerms(job) { const text = `${job.title} ${job.description || ""} ${(job.requirements || []).join(" ")} ${(job.niceToHave || []).join(" ")}`; return TAXONOMY.filter(t => termIn(text, t)); },
  requiredTerms(job) { const text = `${(job.requirements || []).join(" ")}`; return TAXONOMY.filter(t => termIn(text, t)); },
  evidence(userId, d) {
    const segs = Resume.segments(d || Resume.empty());
    const claims = Repo.find("keyword_claims", c => c.userId === userId);
    const map = {};
    TAXONOMY.forEach(t => {
      const backed = segs.find(s => s.backed && termIn(s.text, t));
      const loose = segs.find(s => !s.backed && termIn(s.text, t));
      const claim = claims.find(c => c.term === t.term);
      let state = "ausente", ev = null, origin = null;
      if (backed) { state = "sustentado"; ev = backed.text; origin = backed.where; }
      else if (claim && claim.confirmed && claim.evidence) { state = "sustentado"; ev = claim.evidence; origin = "Declarado por você"; }
      else if (claim || loose) { state = "confirmar"; ev = claim ? (claim.evidence || "Você indicou ter essa competência, falta descrever onde a usou.") : loose.text; origin = claim ? "Declarado por você" : loose.where + " (sem experiência que comprove)"; }
      map[t.term] = { ...t, state, evidence: ev, origin };
    });
    return map;
  },
  families(ev) {
    return FAMILIES.map(f => { const terms = TAXONOMY.filter(t => t.fam.includes(f.key)); const ok = terms.filter(t => ev[t.term].state === "sustentado"); return { ...f, total: terms.length, matched: ok.map(t => t.term), pct: U.pct(ok.length, terms.length) }; }).sort((a, b) => b.pct - a.pct);
  },
};

/* ---------------- curadoria e aderência ---------------- */
const DEFAULT_WEIGHTS = { skills: 40, role: 20, location: 15, modality: 10, level: 10, recency: 5 };
const DIM_LABEL = { skills: "Competências", role: "Cargo-alvo", location: "Localização", modality: "Modalidade", level: "Nível e requisitos", recency: "Recência" };
const Match = {
  weights() { return Object.assign({}, DEFAULT_WEIGHTS, Repo.setting("weights", {})); },
  jobStatus(job) {
    if (job.duplicateOf) return { key: "dup", label: "Duplicata", cls: "" };
    if (job.status === "expired" || (job.deadline && job.deadline < U.today())) return { key: "expired", label: "Expirada / indisponível", cls: "bad" };
    if (!job.lastCheckedAt) return { key: "unverified", label: "Não verificada", cls: "warn" };
    if (U.daysBetween(job.lastCheckedAt, U.now()) > 14) return { key: "stale", label: `Verificada há ${U.daysBetween(job.lastCheckedAt, U.now())} dias`, cls: "warn" };
    return { key: "ok", label: `Verificada em ${U.fmtDate(job.lastCheckedAt)}`, cls: "ok" };
  },
  score(profile, ev, job) {
    const w = Match.weights(); const dims = {}; const notes = [];
    const jt = Keywords.jobTerms(job); const req = Keywords.requiredTerms(job);
    const sust = jt.filter(t => ev[t.term]?.state === "sustentado");
    const confirm = jt.filter(t => ev[t.term]?.state === "confirmar");
    dims.skills = jt.length ? (sust.length + confirm.length * .3) / Math.max(jt.length, 4) : .4; // mínimo de 4 termos evita nota alta em anúncio vago
    const roles = (profile.targetRoles || []).map(U.norm);
    const titleSim = Math.max(0, ...roles.map(r => U.jaccard(r, job.title)));
    const famHit = (profile.families || []).includes(job.family);
    dims.role = Math.min(1, Math.max(titleSim * 1.6, famHit ? .7 : 0));
    const city = U.norm(job.city), uf = U.norm(job.uf);
    dims.location = job.modality === "Remoto" ? 1 : city === U.norm(profile.city) ? 1 : (profile.city2 && city === U.norm(profile.city2)) ? .8 : uf && uf === U.norm(profile.uf) ? .45 : 0;
    const mods = profile.modalities || [];
    dims.modality = !job.modality || job.modality === "Não informada" ? .5 : mods.includes(job.modality) ? 1 : 0;
    let lvl = (profile.levels || []).includes(job.level) ? 1 : .4;
    if (job.minSemester && profile.semester && profile.semester < job.minSemester) { lvl = 0; notes.push(`Exige a partir do ${job.minSemester}º semestre; você está no ${profile.semester}º.`); }
    if (job.maxSemester && profile.semester && profile.semester > job.maxSemester) { lvl = 0; notes.push(`Aceita até o ${job.maxSemester}º semestre.`); }
    dims.level = lvl;
    const age = job.publishedAt ? U.daysBetween(job.publishedAt, U.now()) : 60;
    dims.recency = age <= 7 ? 1 : age <= 30 ? .6 : .2;
    if (profile.salaryMin && (job.salaryMax || job.salaryMin) && (job.salaryMax || job.salaryMin) < profile.salaryMin) notes.push(`Salário informado (${salaryText(job)}) abaixo do mínimo que você indicou. No piloto, a vaga continua aparecendo.`);
    const total = Object.values(w).reduce((a, b) => a + b, 0) || 1;
    const score = Math.round(Object.entries(w).reduce((s, [k, v]) => s + v * (dims[k] || 0), 0) / total * 100);
    const missingReq = req.filter(t => ev[t.term]?.state !== "sustentado");
    return { score, dims, matched: sust.map(t => t.term), toConfirm: confirm.map(t => t.term), gaps: jt.filter(t => ev[t.term]?.state === "ausente").map(t => t.term), missingRequired: missingReq.map(t => t.term), notes, blocking: lvl === 0 };
  },
  /* Deduplicação por URL canônica, identificador da fonte e similaridade */
  findDuplicate(job, list) {
    const canon = job.url ? U.canonicalUrl(job.url) : "";
    return list.find(o => o.id !== job.id && !o.duplicateOf && ((canon && o.url && U.canonicalUrl(o.url) === canon) || (job.sourceId && job.externalId && o.sourceId === job.sourceId && o.externalId === job.externalId) || (U.norm(o.company) === U.norm(job.company) && U.norm(o.city) === U.norm(job.city) && U.jaccard(o.title, job.title) >= .85))) || null;
  },
  dedupeAll() { const jobs = Repo.all("jobs"); jobs.forEach(j => j.duplicateOf = null); jobs.forEach(j => { const d = Match.findDuplicate(j, jobs.filter(x => x.createdAt <= j.createdAt && x.id !== j.id)); if (d) j.duplicateOf = d.id; }); Repo.save(); },
};

  used(userId, month = U.month()) { return new Set(Repo.find("usage_events", e => e.userId === userId && e.type === "oportunidade_entregue" && e.month === month).map(e => e.jobId)).size; },

   CAMADA 4 — interface: estado da tela, navegação, modais e eventos
   ===================================================================== */
const e = U.esc;
const App = {
  route: { page: "landing", params: {} },
  ui: {},            // estado efêmero por tela (filtros, abas)
  _modal: null,
  session() { const id = Repo.data?.session; return id ? Repo.get("users", id) : null; },
  go(page, params = {}) { this.route = { page, params }; this.closeMenu(); this.render(); window.scrollTo({ top: 0 }); },
  toast(msg, bad) { const box = document.getElementById("toasts"); const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role", "status"); t.textContent = msg; box.appendChild(t); setTimeout(() => t.remove(), 3600); },
  closeMenu() { document.querySelector(".rail")?.classList.remove("open"); document.querySelector(".scrim")?.remove(); },
  openMenu() { document.querySelector(".rail")?.classList.add("open"); const s = document.createElement("div"); s.className = "scrim"; s.dataset.act = "closeMenu"; document.body.appendChild(s); },

  /* modal: corpo em HTML + ações; resolve com callback */
  modal({ title, body, actions = [], wide = false, onAction }) {
    this.closeModal();
    const bg = document.createElement("div"); bg.className = "modal-bg"; bg.dataset.modalBg = "1";
    bg.innerHTML = `<div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row-between"><h2 id="modal-title">${e(title)}</h2><button class="btn btn-ghost btn-sm" data-modal="close" aria-label="Fechar">✕</button></div><div class="stack">${body}</div><div class="modal-actions">${actions.map(a => `<button class="btn ${a.cls || "btn-ghost"}" data-modal="${e(a.key)}">${e(a.label)}</button>`).join("")}</div></div>`;
    document.body.appendChild(bg); this._modal = { el: bg, onAction };
    setTimeout(() => (bg.querySelector("input,textarea,select,[data-modal]:not([data-modal=close])") || bg.querySelector("button"))?.focus(), 30);
  },
  closeModal() { this._modal?.el.remove(); this._modal = null; },
  confirm(title, body, okLabel, cb, danger) { this.modal({ title, body: `<p>${body}</p>`, actions: [{ key: "cancel", label: "Cancelar" }, { key: "ok", label: okLabel, cls: danger ? "btn-danger" : "btn-primary" }], onAction: k => { if (k === "ok") cb(); return true; } }); },

  /* exportação: arquivo quando o navegador permite + texto para copiar sempre */
  exportText(title, filename, text, mime = "text/plain;charset=utf-8") {
    this.modal({ title, wide: true, body: `<p class="small muted">Se o download não começar (alguns visualizadores bloqueiam), use “Copiar” e cole num editor de texto.</p><textarea id="export-text" class="textarea mono" style="min-height:300px" readonly>${e(text)}</textarea>`, actions: [{ key: "copy", label: "Copiar" }, { key: "dl", label: "Baixar " + filename.split(".").pop().toUpperCase(), cls: "btn-primary" }], onAction: k => {
      if (k === "copy") { const ta = document.getElementById("export-text"); navigator.clipboard?.writeText(text).then(() => App.toast("Copiado.")).catch(() => { ta.select(); App.toast("Selecionado. Use Ctrl+C para copiar."); }); return false; }
      if (k === "dl") {
        if (window.claude?.use) { window.claude.use("downloads").then(dl => { if (!dl) return App.toast("Download indisponível aqui. Use Copiar.", true); return dl.save({ filename, data: text }).then(() => App.toast("Arquivo salvo: " + filename)).catch(err => App.toast(err?.code === "declined" ? "Download cancelado." : "Não foi possível baixar aqui. Use Copiar.", err?.code !== "declined")); }); return false; }
        try { const b = new Blob([text], { type: mime }), url = URL.createObjectURL(b), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); App.toast("Download iniciado: " + filename); } catch (err) { App.toast("O download foi bloqueado. Use Copiar.", true); } return false; }
      return true;
    } });
  },

  render() {
    const root = document.getElementById("app");
    const active = document.activeElement; const fid = active && active.id; const sel = fid && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
    const s = this.session();
    if (!s) { root.innerHTML = this.route.page === "landing" ? Views.landing() : Views.auth(this.route.page); }
    else {
      if (s.status === "suspenso") { Repo.data.session = null; Repo.save(); this.toast("Conta suspensa. Fale com o suporte.", true); return this.go("login"); }
      const area = s.role === "admin" ? "admin" : "cand";
      if (!this.route.page.startsWith(area + ".")) this.route = { page: area + (area === "admin" ? ".dashboard" : ".home"), params: {} };
      const view = Views[this.route.page];
      root.innerHTML = Views.shell(s, view ? view(s, this.route.params) : Views.notFound());
    }
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (x) { } } }
  },
};

/* ---------------- componentes ---------------- */
const C = {
  pill(text, cls = "") { return `<span class="pill ${cls}">${e(text)}</span>`; },
  demoPill(job) { return job.isDemo ? C.pill("Dado demonstrativo", "demo") : C.pill("Anúncio real", "info"); },
  meter(v, max, cls = "", usage = false) { const p = max ? U.clamp(v / max * 100, 0, 100) : 0; return `<div class="meter ${usage ? (p >= 100 ? "bad" : p >= 85 ? "warn" : cls) : cls}" role="progressbar" aria-valuenow="${v}" aria-valuemax="${max}"><span style="width:${p}%"></span></div>`; },
  score(v) { return `<div class="score" style="--p:${v}" aria-label="Aderência ${v}%"><span>${v}</span></div>`; },
  empty(title, body, action = "") { return `<div class="empty"><b>${e(title)}</b><p>${body}</p>${action ? `<div style="margin-top:12px">${action}</div>` : ""}</div>`; },
  notice(text, cls = "info", icon = "i") { return `<div class="notice ${cls}"><span class="ic" aria-hidden="true">${icon}</span><div>${text}</div></div>`; },
  field(id, label, input, hint = "") { return `<div class="field"><label for="${id}">${e(label)}</label>${input}${hint ? `<span class="hint">${hint}</span>` : ""}</div>`; },
  input(id, value = "", attrs = "") { return `<input class="input" id="${id}" name="${id}" value="${e(value)}" ${attrs}>`; },
  select(id, opts, value, attrs = "") { return `<select class="select" id="${id}" name="${id}" ${attrs}>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${e(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${e(l)}</option>`; }).join("")}</select>`; },
  textarea(id, value = "", attrs = "") { return `<textarea class="textarea" id="${id}" name="${id}" ${attrs}>${e(value)}</textarea>`; },
  checks(name, opts, values) { return `<div class="chips">${opts.map(o => `<label class="check chip" style="padding:5px 9px"><input type="checkbox" name="${name}" value="${e(o)}" ${(values || []).includes(o) ? "checked" : ""}> ${e(o)}</label>`).join("")}</div>`; },
  tabs(current, items, act) { return `<div class="seg" role="tablist">${items.map(([k, l]) => `<button role="tab" aria-selected="${k === current}" class="${k === current ? "on" : ""}" data-act="${act}" data-v="${k}">${e(l)}</button>`).join("")}</div>`; },
  head(eyebrow, title, lead = "", right = "") { return `<div class="page-head"><div><div class="eyebrow">${e(eyebrow)}</div><h1 style="margin-top:6px">${e(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>${right ? `<div class="row">${right}</div>` : ""}</div>`; },
};

const Cand = {
  profile(s) { return Repo.one("profiles", p => p.userId === s.id) || Repo.insert("profiles", { userId: s.id, city: s.city || "", uf: s.uf || "", city2: "", targetRoles: [], families: [], modalities: ["Presencial", "Híbrido", "Remoto"], levels: ["Estágio", "Assistente/Auxiliar", "Júnior"], semester: null, course: "", availability: "", salaryMin: null, minScore: 40 }); },
  resume(s) { return Repo.one("resumes", r => r.userId === s.id); },
  hasResume(s) { const r = Cand.resume(s); return !!(r && ((r.data.experiences || []).length || (r.data.skills || []).length)); },
  ev(s) { return Keywords.evidence(s.id, Cand.resume(s)?.data); },
  feedback(s) { const m = {}; Repo.find("job_feedback", f => f.userId === s.id).forEach(f => m[f.jobId] = f); return m; },
  curated(s) {
    const prof = Cand.profile(s), ev = Cand.ev(s), fb = Cand.feedback(s);
    return Repo.all("jobs").filter(j => !j.duplicateOf).map(job => ({ job, st: Match.jobStatus(job), m: Match.score(prof, ev, job), fb: fb[job.id] || null })).sort((a, b) => b.m.score - a.m.score || String(b.job.publishedAt).localeCompare(String(a.job.publishedAt)));
  },
  /* entrega: só vagas verificadas, não expiradas, acima da aderência mínima; consome o plano uma vez por vaga/mês */
  recommendations(s) {
    const prof = Cand.profile(s); const all = Cand.curated(s);
    const eligible = all.filter(x => ["ok", "stale"].includes(x.st.key) && x.m.score >= (prof.minScore || 0) && x.fb?.state !== "dispensada");
    let fresh = 0; const out = [];
    for (const x of eligible) {
      const already = !!Repo.one("usage_events", u => u.key === `${s.id}|${x.job.id}|${U.month()}`);
      const ok = Plans.deliver(s.id, x.job.id); if (ok && !already) fresh++;
      out.push({ ...x, locked: !ok });
    }
    if (fresh) notify(s.id, `${fresh} nova(s) vaga(s) compatível(is)`, "Entregues na sua área de vagas, com motivo da recomendação.", "ok", "cand.jobs");
    return out;
  },
  apps(s) { return Repo.find("applications", a => a.userId === s.id).sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt))); },
  saveVersion(s, data, label, changes = [], jobId = null, type = "base") { return Repo.insert("resume_versions", { userId: s.id, type, label, jobId, data: JSON.parse(JSON.stringify(data)), changes }); },
};

  </div>

      recs.filter(x => !x.locked).slice(0, 3).map(x => `<div class="row" style="gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">${C.score(x.m.score)}<div class="grow"><b>${e(x.job.title)}</b><div class="small muted">${e(x.job.company)} · ${e(x.job.city)} · ${e(x.job.modality)}</div><div style="margin-top:4px">${C.demoPill(x.job)}</div></div><button class="btn btn-ghost btn-sm" data-go="cand.job" data-id="${e(x.job.id)}">Detalhes</button></div>`).join("") || C.empty("Nenhuma vaga acima da sua aderência mínima", "Ajuste preferências ou a aderência mínima no perfil.")}

};

    </div>
    <div class="stack"><div class="card stack" style="text-align:center;justify-items:center"><div class="score" style="--p:${a.score};width:96px;height:96px;font-size:26px"><span>${a.score}</span></div><b>Nota de clareza e estrutura</b><p class="small muted">Mede organização e legibilidade. Não é chance de contratação.</p>
      ${r.status === "revisado" ? C.pill("Você marcou como revisado", "ok") : `<button class="btn btn-primary" data-act="markReviewed">Marcar currículo como revisado</button>`}</div>
      ${C.notice("Sugestões editoriais mudam a forma, nunca os fatos. Datas, empresas e competências só mudam se você editar.", "info")}
    </div></div>`;
  },
  keywords(s, r) {
    const ev = Cand.ev(s); const fams = Keywords.families(ev); const filt = App.ui.kwFilter || "relevantes";
    const prof = Cand.profile(s);
    const relevantTerms = new Set(); Repo.all("jobs").filter(j => !j.duplicateOf && (prof.families || []).includes(j.family)).forEach(j => Keywords.jobTerms(j).forEach(t => relevantTerms.add(t.term)));
    let rows = Object.values(ev);
    if (filt === "relevantes") rows = rows.filter(t => t.state !== "ausente" || relevantTerms.has(t.term));
    else if (filt !== "todas") rows = rows.filter(t => t.state === filt);
    const order = { sustentado: 0, confirmar: 1, ausente: 2 }; rows.sort((a, b) => order[a.state] - order[b.state] || a.term.localeCompare(b.term));
    const pillFor = st => st === "sustentado" ? C.pill("Sustentado", "ok") : st === "confirmar" ? C.pill("Precisa de confirmação", "warn") : C.pill("Ausente", "");
    const counts = { sustentado: 0, confirmar: 0, ausente: 0 }; Object.values(ev).forEach(t => counts[t.state]++);
    return `<div class="grid g-main"><div class="card"><div class="card-head"><h2>Palavras-chave e evidências</h2>${C.tabs(filt, [["relevantes", "Relevantes"], ["sustentado", `Sustentadas (${counts.sustentado})`], ["confirmar", `A confirmar (${counts.confirmar})`], ["ausente", "Ausentes"], ["todas", "Todas"]], "kwFilter")}</div>
      <div class="table-wrap"><table><thead><tr><th>Termo</th><th>Tipo</th><th>Estado</th><th>Evidência</th><th></th></tr></thead><tbody>
      ${rows.map(t => `<tr><td><b>${e(t.term)}</b></td><td class="small">${e(t.type)}</td><td>${pillFor(t.state)}</td><td class="small">${t.evidence ? `<span class="muted">${e(t.origin)}:</span> “${e(String(t.evidence).slice(0, 110))}”` : `<span class="muted">${relevantTerms.has(t.term) ? "Aparece nas vagas da sua área." : "—"}</span>`}</td><td>${t.state !== "sustentado" ? `<button class="btn btn-soft btn-sm" data-act="claimTerm" data-term="${e(t.term)}">Tenho essa experiência</button>` : t.origin === "Declarado por você" ? `<button class="btn btn-ghost btn-sm" data-act="unclaimTerm" data-term="${e(t.term)}">Remover</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5">${C.empty("Nada neste filtro", "")}</td></tr>`}
      </tbody></table></div>
      <p class="small muted" style="margin-top:10px">Só termos <b>sustentados</b> entram como competência no currículo e na pontuação. “Ausente” aparece como lacuna de desenvolvimento, nunca como qualificação.</p></div>
      <div class="card"><h2 style="margin-bottom:12px">Famílias de cargo compatíveis</h2><div class="bars">${fams.map(f => `<div class="bar-row"><span class="small">${e(f.name)}</span><div class="track"><div class="fill" style="width:${f.pct}%"></div></div><span class="small num" style="text-align:right">${f.pct}%</span></div>`).join("")}</div>
      <p class="small muted" style="margin-top:12px">Percentual de termos da família que seu currículo já sustenta. Use para escolher cargos-alvo no perfil.</p></div></div>`;
  },
  versions(s, r) {
    const vers = Repo.find("resume_versions", v => v.userId === s.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return `<div class="grid g-main"><div class="card"><div class="card-head"><h2>Histórico de versões</h2><span class="pill">${vers.length}</span></div>
      ${vers.length ? `<div class="table-wrap"><table><thead><tr><th>Versão</th><th>Tipo</th><th>Data</th><th></th></tr></thead><tbody>${vers.map(v => { const j = v.jobId ? Repo.get("jobs", v.jobId) : null; return `<tr><td><b>${e(v.label)}</b>${v.changes?.length ? `<div class="xs muted">${v.changes.length} alteração(ões) registrada(s)</div>` : ""}</td><td>${v.type === "vaga" ? C.pill("Para vaga: " + (j ? j.title : "removida"), "info") : C.pill("Base")}</td><td class="small num">${U.fmtDateTime(v.createdAt)}</td><td><div class="row" style="gap:4px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="viewVersion" data-id="${e(v.id)}">Ver</button><button class="btn btn-ghost btn-sm" data-act="diffVersion" data-id="${e(v.id)}">Comparar</button>${v.type === "base" ? `<button class="btn btn-ghost btn-sm" data-act="restoreVersion" data-id="${e(v.id)}">Restaurar</button>` : ""}</div></td></tr>`; }).join("")}</tbody></table></div>` : C.empty("Sem versões", "Cada vez que você salva, aceita uma sugestão ou gera um currículo para uma vaga, uma versão é guardada aqui.")}</div>
      <div class="card stack"><h2>Exportar currículo atual</h2>${r ? `<p class="small muted">Texto simples, legível por sistemas de recrutamento. A ordem das seções é mantida.</p><button class="btn btn-primary" data-act="exportResume" data-v="txt">Exportar .txt</button><button class="btn btn-ghost" data-act="exportResume" data-v="html">Exportar .html (imprimível)</button><p class="small muted">PDF e DOCX: abra o .html no navegador e use “Imprimir → Salvar como PDF”. A geração direta entra com a integração de arquivos.</p>` : '<p class="muted small">Monte o currículo primeiro.</p>'}</div></div>`;
  },
};

/* ---------------- Vagas (Etapas 2 e 3) ---------------- */
Views["cand.jobs"] = (s) => {
  if (!Cand.hasResume(s)) return `${C.head("Etapa 2", "Vagas para você")}${C.empty("O currículo vem primeiro", "A curadoria usa o que o seu currículo sustenta. Preencha experiências ou competências para liberar as vagas.", `<button class="btn btn-primary" data-go="cand.resume">Montar currículo</button>`)}`;
  if (Plans.of(s.id).limit === 0) return `${C.head("Etapas 2 e 3", "Vagas para você")}<div class="card">${C.empty("Seu currículo é grátis. As vagas vêm com um plano.", `No plano Grátis você arruma o currículo e deixa ele pronto para recrutadores e sistemas de IA. Para receber vagas escolhidas pelo seu currículo, todas de uma vez, escolha um plano: ${Plans.list().filter(p => p.limit).map(p => `<b>${e(p.name)}</b> ${U.money(p.price)}, até ${p.limit} vagas`).join(" · ")}.`, `<button class="btn btn-primary" data-go="cand.plan">Ver planos</button>`)}</div>`;
  const tab = App.ui.jobsTab || "rec"; const f = App.ui.jobFilter || {};

  const recs = Cand.recommendations(s); const used = Plans.used(s.id);
  const fb = Cand.feedback(s);
  let list;
  if (tab === "rec") list = recs;
  else if (tab === "saved") list = Cand.curated(s).filter(x => fb[x.job.id]?.state === "salva");
  else if (tab === "dismissed") list = Cand.curated(s).filter(x => fb[x.job.id]?.state === "dispensada");
  else list = Cand.curated(s);
  const q = U.norm(f.q || "");
  list = list.filter(x => (!q || U.norm(`${x.job.title} ${x.job.company} ${x.job.description}`).includes(q)) && (!f.city || x.job.city === f.city) && (!f.mod || x.job.modality === f.mod) && (!f.lvl || x.job.level === f.lvl) && (!f.fam || x.job.family === f.fam) && (!f.size || (x.job.companySize || "Não informado") === f.size) && (!f.stage || careerStage(x.job.level) === f.stage) && (!f.sal || (f.sal === "informado" ? !!(x.job.salaryMin || x.job.salaryMax) : (x.job.salaryMax || x.job.salaryMin || 0) >= +f.sal)));
  const cities = [...new Set(Repo.all("jobs").map(j => j.city))].sort();
  const locked = list.filter(x => x.locked).length;
  return `${C.head("Etapas 2 e 3", "Vagas para você", `Ordenadas por aderência, com o motivo de cada recomendação. Aderência mínima: <b>${prof.minScore}%</b> · <button class="btn-link" data-go="cand.profile">ajustar</button>`, `<div class="stack-sm" style="min-width:220px"><div class="row-between small"><span>Plano ${e(plan.name)}</span><span class="num">${used}/${plan.limit} no mês</span></div>${C.meter(used, plan.limit, "", true)}</div>`)}
  <div class="row-between" style="margin-bottom:12px">${C.tabs(tab, [["rec", `Recomendadas (${recs.filter(x => !x.locked).length})`], ["saved", "Salvas"], ["dismissed", "Dispensadas"], ["all", "Explorar catálogo"]], "jobsTab")}</div>
  <details class="card filters" style="margin-bottom:14px" ${App.ui.filtersOpen || Object.values(f).some(Boolean) ? "open" : ""}><summary class="row-between" data-act="toggleFilters"><b>Filtros</b><span class="small muted">${Object.values(f).filter(Boolean).length ? Object.values(f).filter(Boolean).length + " ativo(s)" : "cidade, modalidade, nível, área, salário, porte, momento de carreira"}</span></summary><div class="row" style="align-items:end;margin-top:12px">
    <div class="field grow" style="min-width:180px"><label for="jf-q">Buscar</label>${C.input("jf-q", f.q || "", 'placeholder="Cargo, empresa, palavra" data-input="jobFilter"')}</div>
    <div class="field"><label for="jf-city">Cidade</label>${C.select("jf-city", [["", "Todas"], ...cities], f.city, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-mod">Modalidade</label>${C.select("jf-mod", [["", "Todas"], "Presencial", "Híbrido", "Remoto", "Não informada"], f.mod, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-lvl">Nível</label>${C.select("jf-lvl", [["", "Todos"], "Jovem aprendiz", "Estágio", "Assistente/Auxiliar", "Júnior", "Pleno"], f.lvl, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-fam">Área</label>${C.select("jf-fam", [["", "Todas"], ...FAMILIES.map(x => [x.key, x.name])], f.fam, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-sal">Salário</label>${C.select("jf-sal", [["", "Qualquer"], ["informado", "Só com salário informado"], ["1500", "A partir de R$ 1.500"], ["2500", "A partir de R$ 2.500"], ["4000", "A partir de R$ 4.000"]], f.sal, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-size">Porte da empresa</label>${C.select("jf-size", [["", "Todos"], ...COMPANY_SIZES], f.size, 'data-change="jobFilter"')}</div>
    <div class="field"><label for="jf-stage">Momento de carreira</label>${C.select("jf-stage", [["", "Todos"], ...CAREER_STAGES], f.stage, 'data-change="jobFilter"')}</div>
    <button class="btn btn-ghost" data-act="clearJobFilter">Limpar</button></div></details>
  ${tab === "all" ? C.notice("O catálogo mostra também vagas abaixo da sua aderência mínima, expiradas e não verificadas, sempre sinalizadas. Elas não contam no seu plano.", "info") : ""}
  ${locked ? C.notice(`${locked} vaga(s) compatível(is) ficaram fora porque o limite do plano foi atingido este mês. <button class="btn-link" data-go="cand.plan">Ver planos</button>`, "warn", "!") : ""}
  <div class="card" style="margin-top:12px">${list.length ? list.map(x => JobCard(s, x, fb)).join("") : C.empty(tab === "rec" ? "Nenhuma vaga acima da sua aderência mínima" : "Nada aqui", tab === "rec" ? "Ajuste filtros, preferências ou reduza a aderência mínima no perfil." : "")}</div>`;
};

}

      <div><div class="label">Lacunas</div><div class="chips" style="margin-top:6px">${m.gaps.map(t => `<span class="chip">${e(t)}</span>`).join("") || '<span class="small muted">Nenhuma lacuna nos termos reconhecidos.</span>'}</div></div>
      ${m.missingRequired.length ? C.notice(`<b>Requisitos obrigatórios não atendidos:</b> ${m.missingRequired.map(e).join(", ")}`, "bad", "✕") : ""}

function AppModal(s, a) {
  const j = Repo.get("jobs", a.jobId); const vers = Repo.find("resume_versions", v => v.userId === s.id && (v.jobId === a.jobId || v.type === "base"));

  <div class="form-grid">
    ${C.field("ap-status", "Status", C.select("ap-status", APP_STATES, a.status, 'data-change="apStatus"'))}
    ${C.field("ap-version", "Currículo usado", C.select("ap-version", [["", "Não definido"], ...vers.map(v => [v.id, v.label + " · " + U.fmtDate(v.createdAt)])], a.resumeVersionId || ""))}
    <div class="full">${C.field("ap-next", "Próxima ação", C.input("ap-next", a.next))}</div>
    <div class="full">${C.field("ap-evidence", "Protocolo ou evidência do envio", C.input("ap-evidence", a.evidence, 'placeholder="Número de protocolo, mensagem de confirmação ou e-mail recebido"'))}</div>
  </div>
  <div id="ap-proof" class="${NEEDS_PROOF.includes(a.status) && !a.confirmed ? "" : "hidden"} notice warn"><span class="ic">!</span><div class="stack-sm"><b>Confirmação obrigatória</b><label class="check"><input type="checkbox" id="ap-proof-ok"> O portal mostrou confirmação de envio ou forneceu protocolo. Só marque se isso aconteceu.</label><span class="small">Preencha a evidência acima.</span></div></div>
  <div id="ap-int" class="${a.status === "Entrevista agendada" ? "" : "hidden"} form-grid sunken">${C.field("ap-int-date", "Data da entrevista", C.input("ap-int-date", a.interview?.date || "", 'type="date"'))}${C.field("ap-int-time", "Horário", C.input("ap-int-time", a.interview?.time || "", 'type="time"'))}<div class="full">${C.field("ap-int-place", "Local ou link", C.input("ap-int-place", a.interview?.place || ""))}</div></div>
  ${EnvioPanel(s, a)}
  ${C.field("ap-notes", "Observações", C.textarea("ap-notes", a.notes, 'rows="3"'))}
  <div><div class="label" style="margin-bottom:8px">Histórico</div><div class="timeline">${(a.history || []).slice().reverse().map(h => `<div class="t"><b>${e(h.status)}</b> <span class="muted xs">${U.fmtDateTime(h.at)}</span>${h.note ? `<div class="xs muted">${e(h.note)}</div>` : ""}</div>`).join("")}</div></div>`;
}
