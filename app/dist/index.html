/* =====================================================================
   DASHBOARD COM ASSISTENTE EM CONVERSA
   Regras locais e determinísticas. Nada aqui é IA externa: quando o
   provedor for conectado, o motor de respostas troca, a tela fica.
   ===================================================================== */
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const Assistant = {
  /* fotografia do estado do candidato, usada por todas as respostas */
  state(s) {
    const r = Cand.resume(s); const has = Cand.hasResume(s); const prof = Cand.profile(s);
    const diag = r ? Resume.analyze(r.data) : null;
    const sugg = r ? Resume.suggestions(r.data).filter(x => !(r.dismissed || []).includes(x.id)) : [];
    const recs = has ? Cand.recommendations(s).filter(x => !x.locked) : [];
    const apps = Cand.apps(s);
    const pending = apps.filter(a => ["Aguardando ação do candidato", "Envio tentado — sem confirmação"].includes(a.status));
    const active = apps.filter(a => !["Processo encerrado", "Vaga expirada/indisponível", "Descartada"].includes(a.status));
    const preparing = active.filter(a => !a.confirmed && !pending.includes(a));
    const interviews = apps.filter(a => a.status === "Entrevista agendada" && a.interview?.date && a.interview.date >= U.today()).sort((a, b) => a.interview.date.localeCompare(b.interview.date));
    const plan = Plans.of(s.id);
    return { r, has, prof, diag, sugg, recs, apps, pending, active, preparing, interviews, plan, used: Plans.used(s.id), integrity: diag?.items.find(i => i.id === "integrity" && i.status === "fail") };
  },
  jobTitle(a) { const j = Repo.get("jobs", a.jobId); return j ? `${j.title} — ${j.company}` : (a.jobTitle || "Vaga"); },
  company(a) { const j = Repo.get("jobs", a.jobId); return j?.company || a.jobCompany || "essa vaga"; },
  hello() { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; },

  /* abertura: resumo + a pergunta do próximo passo */
  opening(s) {
    const st = Assistant.state(s); const first = s.name.split(" ")[0]; const out = [];
    if (!st.has) {
      out.push({ text: `${Assistant.hello()}, ${first}. Eu sou o assistente do Manda Vaga. Antes de buscar vagas, preciso conhecer o seu currículo: é ele que define o que eu vou trazer para você.` });
      out.push({ text: "Como prefere começar?", chips: [["go", "cand.resume:import", "Colar meu currículo"], ["go", "cand.resume:editor", "Preencher do zero"], ["intent", "how", "Como funciona?"]] });
      return out;
    }
    if (st.plan.limit === 0) {
      out.push({ html: `${Assistant.hello()}, ${e(first)}. Seu currículo está com nota <b>${st.diag.score}/100</b>${st.sugg.length ? ` e tem <b>${pl(st.sugg.length, "ajuste sugerido", "ajustes sugeridos")}</b>` : ""}. No plano Grátis você deixa o currículo pronto para recrutadores e sistemas de IA.` });
      out.push({ html: `Quando quiser receber vagas escolhidas pelo seu currículo: ${Plans.list().filter(p => p.limit).map(p => `<b>${e(p.name)}</b>, até ${p.limit} vagas de uma vez`).join(", ")}. O Max inclui envio facilitado e a Central de Respostas.`, chips: [["go", "cand.resume:diag", "Melhorar meu currículo"], ["go", "cand.plan", "Ver planos"]] });
      return out;
    }
    const facts = [];
    facts.push(`<b>${pl(st.recs.length, "vaga compatível", "vagas compatíveis")}</b> acima de ${st.prof.minScore}%`);
    if (st.pending.length) facts.push(`<b>${pl(st.pending.length, "candidatura", "candidaturas")}</b> esperando ação sua`);
    if (st.interviews.length) facts.push(`entrevista em <b>${U.fmtDate(st.interviews[0].interview.date)}</b>`);
    if (st.sugg.length) facts.push(`<b>${pl(st.sugg.length, "ajuste sugerido", "ajustes sugeridos")}</b> no currículo`);
    const list = facts.length > 1 ? facts.slice(0, -1).join(", ") + " e " + facts.at(-1) : facts[0];
    out.push({ html: `${Assistant.hello()}, ${e(first)}. Hoje você tem ${list}.` });
    if (st.integrity) out.push({ text: "Antes de tudo, um ponto importante: o seu resumo afirma um tempo de experiência que as datas não sustentam. Recrutador costuma conferir isso. Quer corrigir agora?", chips: [["go", "cand.resume:diag", "Revisar o currículo"], ["intent", "later", "Depois"]] });
    if (st.interviews.length) { const a = st.interviews[0]; out.push({ html: `Lembrete: entrevista para <b>${e(Assistant.jobTitle(a))}</b> em ${U.fmtDate(a.interview.date)}${a.interview.time ? " às " + e(a.interview.time) : ""}${a.interview.place ? ` (${e(a.interview.place)})` : ""}.`, chips: [["app", a.id, "Ver candidatura"]] }); }
    if (st.pending.length) { const a = st.pending[0]; out.push({ html: `A candidatura para <b>${e(Assistant.jobTitle(a))}</b> está parada em “${e(a.status)}”.${a.next ? ` Próximo passo: ${e(a.next)}.` : ""}`, chips: [["app", a.id, "Abrir candidatura"], ["intent", "resolved:" + a.id, "Já resolvi"]] }); }
    const focus = st.pending[0] || st.preparing[0];
    const chips = [];
    if (focus) chips.push(["app", focus.id, "Continuar a candidatura"]);
    chips.push(["intent", "widen", "Ampliar a lista de vagas"], ["intent", "top", "Ver as melhores vagas"]);
    const fj = focus ? Repo.get("jobs", focus.jobId) : null;
    out.push({ html: focus ? `Agora me diga: vamos continuar a candidatura para <b>${e(fj?.title || focus.jobTitle || "a vaga")}</b>${fj ? ` (${e(fj.company)})` : ""} ou você prefere que eu amplie a lista de vagas para ter mais opções?` : "Por onde quer seguir: ver as melhores vagas de agora ou ampliar a lista para ter mais opções?", chips });
    return out;
  },

  /* respostas a botões e a texto livre */
  reply(s, intent, arg) {
    const st = Assistant.state(s);
    if (intent === "top") {
      const top = st.recs.slice(0, 3);
      if (!top.length) return [{ text: "Não há vagas acima da sua aderência mínima agora. Posso ampliar a lista reduzindo a aderência mínima.", chips: [["intent", "widen", "Ampliar a lista"]] }];
      return [{ text: top.length === 1 ? "Esta é a melhor vaga agora, pela aderência ao seu currículo:" : `Estas são as ${top.length} melhores agora, pela aderência ao seu currículo:`, jobs: top.map(x => x.job.id) }, { text: "Quer que eu gere o currículo para alguma delas ou prefere ver todas?", chips: [["go", "cand.jobs", "Ver todas as vagas"], ["intent", "widen", "Ampliar a lista"]] }];
    }
    if (intent === "widen") {
      const prof = Cand.profile(s); const old = prof.minScore || 40; if (old <= 20) return [{ text: "Sua aderência mínima já está em 20%, o menor valor útil. Para ampliar mais, inclua cidades, modalidades ou níveis no perfil.", chips: [["go", "cand.profile", "Abrir preferências"]] }];
      const before = st.recs.length; const nv = Math.max(20, old - 10); Repo.update("profiles", prof.id, { minScore: nv }); const after = Cand.recommendations(s).filter(x => !x.locked).length;
      return [{ html: `Feito. Baixei a aderência mínima de <b>${old}%</b> para <b>${nv}%</b>. Agora são <b>${pl(after, "vaga", "vagas")}</b>${after > before ? ` (<b>+${after - before}</b>)` : ""}. As novas têm mais lacunas: confira o motivo de cada uma antes de se candidatar.`, chips: [["intent", "top", "Ver as melhores"], ["intent", "undoWiden:" + old, "Desfazer"]] }];
    }
    if (intent === "undoWiden") { const prof = Cand.profile(s); Repo.update("profiles", prof.id, { minScore: +arg }); return [{ text: `Voltei a aderência mínima para ${arg}%.` }]; }
    if (intent === "resolved") { const a = Repo.get("applications", arg); if (!a || a.userId !== s.id) return [{ text: "Não encontrei essa candidatura." }]; return [{ html: `Ótimo. O que aconteceu com <b>${e(Assistant.jobTitle(a))}</b>? Se o portal mostrou confirmação, registre o protocolo para eu contar como enviada.`, chips: [["app", a.id, "Registrar o que aconteceu"]] }]; }
    if (intent === "plan") return [{ html: `Você está no plano <b>${e(st.plan.name)}</b>: ${st.used} de ${st.plan.limit} oportunidades únicas usadas neste mês. Rever a mesma vaga não gasta de novo.`, chips: [["go", "cand.plan", "Ver planos"]] }];
    if (intent === "resume") { if (!st.has) return Assistant.opening(s); return [{ html: `Seu currículo está com nota <b>${st.diag.score}/100</b> em clareza e estrutura${st.sugg.length ? ` e tem <b>${pl(st.sugg.length, "sugestão", "sugestões")}</b> para revisar` : ""}. ${st.r.status === "revisado" ? "Você já marcou como revisado." : "Ainda está como rascunho."}`, chips: [["go", "cand.resume:diag", "Abrir diagnóstico"], ["go", "cand.resume:keywords", "Ver palavras-chave"]] }]; }
    if (intent === "apps") { if (!st.apps.length) return [{ text: "Você ainda não registrou candidaturas. Quando gostar de uma vaga, use “Registrar que vou me candidatar”.", chips: [["intent", "top", "Ver as melhores vagas"]] }]; const sent = st.apps.filter(a => a.confirmed).length; return [{ html: `Você tem <b>${pl(st.active.length, "candidatura", "candidaturas")}</b> em andamento e <b>${sent}</b> com envio confirmado.${st.pending.length ? ` ${st.pending.length === 1 ? "<b>1</b> espera" : `<b>${st.pending.length}</b> esperam`} ação sua.` : ""}`, chips: [["go", "cand.apps", "Abrir candidaturas"], ...(st.pending[0] ? [["app", st.pending[0].id, "Continuar a pendente"]] : [])] }]; }
    if (intent === "how") return [{ text: "Funciona em três etapas: primeiro organizo o seu currículo só com o que você realmente fez; depois cruzo com as vagas e explico a aderência de cada uma; por fim você decide onde se candidatar e eu acompanho o andamento. Nada é enviado sem você." }];
    if (intent === "later") return [{ text: "Combinado. O aviso continua no diagnóstico do currículo." }];
    if (intent === "send") return [{ text: "Eu não envio candidaturas sozinho. Abro o anúncio original, preparo o currículo para a vaga e você clica em enviar no site da empresa. Depois registramos aqui o protocolo.", chips: [["intent", "top", "Ver vagas"]] }];
    return [{ text: "Por enquanto eu entendo perguntas sobre currículo, vagas, candidaturas e plano. A conversa livre com IA entra quando o provedor for conectado.", chips: [["intent", "top", "Melhores vagas"], ["intent", "resume", "Meu currículo"], ["intent", "apps", "Minhas candidaturas"], ["intent", "plan", "Meu plano"]] }];
  },
  parse(text) {
    const t = U.norm(text);
    if (/ampli|mais vagas|mais opc|aument/.test(t)) return ["widen"];
    if (/melhor|vaga|oportunidad|emprego|estagio/.test(t)) return ["top"];
    if (/curricul|cv|resumo|diagnost/.test(t)) return ["resume"];
    if (/candidat|status|resposta|entrevist|protocolo/.test(t)) return ["apps"];
    if (/plano|limite|pagar|preco|assinatura/.test(t)) return ["plan"];
    if (/envi|mandar|aplicar|automatic/.test(t)) return ["send"];
    if (/como funciona|ajuda|o que voce faz/.test(t)) return ["how"];
    return ["fallback"];
  },
};

function ChatMessage(m) {
  if (m.who === "me") return `<div class="msg me"><div class="bubble">${e(m.text)}</div></div>`;
  const jobs = (m.jobs || []).map(id => { const j = Repo.get("jobs", id); if (!j) return ""; const mm = Match.score(Cand.profile(App.session()), Cand.ev(App.session()), j); return `<div class="chat-job">${C.score(mm.score)}<div class="grow" style="min-width:0"><b>${e(j.title)}</b><div class="xs muted">${e(j.company)} · ${e(j.city)} · ${e(j.modality)} · ${e(salaryText(j))}</div>${mm.matched.length ? `<div class="xs" style="margin-top:3px">Combina: ${mm.matched.slice(0, 3).map(e).join(", ")}</div>` : ""}</div><div class="stack-sm"><button class="btn btn-primary btn-sm" data-go="cand.job" data-id="${e(j.id)}">Ver motivo</button><button class="btn btn-ghost btn-sm" data-act="tailorResume" data-id="${e(j.id)}">Gerar currículo</button></div></div>`; }).join("");
  return `<div class="msg bot"><span class="bot-avatar" aria-hidden="true">MV</span><div class="bot-body"><div class="bubble">${m.html || e(m.text)}</div>${jobs ? `<div class="stack-sm">${jobs}</div>` : ""}${m.chips?.length ? `<div class="chips quick">${m.chips.map(([kind, arg, label]) => `<button class="qr" data-act="chat" data-kind="${e(kind)}" data-arg="${e(arg)}">${e(label)}</button>`).join("")}</div>` : ""}</div></div>`;
}

Views["cand.home"] = (s) => {
  if (!App.ui.chat || App.ui.chatUser !== s.id) { App.ui.chat = Assistant.opening(s).map(m => ({ ...m, who: "bot" })); App.ui.chatUser = s.id; }
  const st = Assistant.state(s);
  const steps = [
    [!!(st.prof.targetRoles || []).length && !!st.prof.city, "Perfil e cargos-alvo", "cand.profile"],
    [st.has, "Currículo-base", "cand.resume"],
    [st.r?.status === "revisado", "Currículo revisado", "cand.resume:diag"],
    [st.apps.length > 0, "Primeira candidatura registrada", "cand.jobs"],
  ];
  const done = steps.filter(x => x[0]).length;
  const sent = st.apps.filter(a => a.confirmed).length;
  return `<div class="dash">
    <section class="card chat" aria-label="Assistente Manda Vaga">
      <header class="chat-head"><span class="bot-avatar lg" aria-hidden="true">MV</span><div><b>Assistente Manda Vaga</b><div class="xs muted">Responde com base no seu currículo, vagas e candidaturas</div></div><button class="btn btn-ghost btn-sm" data-act="chatReset" title="Recomeçar a conversa">Recomeçar</button></header>
      <div class="chat-log" id="chat-log" aria-live="polite">${App.ui.chat.map(ChatMessage).join("")}</div>
      <form class="chat-input" data-form="chat" autocomplete="off"><label for="chat-text" class="hidden">Mensagem</label><input class="input" id="chat-text" name="chat-text" placeholder="Pergunte sobre vagas, currículo, candidaturas ou plano…"><button class="btn btn-primary" type="submit" aria-label="Enviar">↑</button></form>
    </section>
    <aside class="stack">
      <div class="card stack-sm"><div class="row-between"><h3>Seu progresso</h3><span class="pill ${done === 4 ? "ok" : "info"}">${done}/4</span></div>${steps.map(([ok, t, go]) => `<button class="mini-step ${ok ? "done" : ""}" data-go="${go}"><span class="tick">${ok ? "✓" : ""}</span>${e(t)}</button>`).join("")}</div>
      <div class="grid g2" style="gap:10px">
        <div class="card stat"><span class="k">Nota do currículo</span><span class="v">${st.diag ? st.diag.score : "—"}</span></div>
        <div class="card stat"><span class="k">Vagas compatíveis</span><span class="v">${st.recs.length}</span></div>
        <div class="card stat"><span class="k">Envios confirmados</span><span class="v">${sent}</span></div>

const MaxFeat = {
  cover(s, a) {
    const j = Repo.get("jobs", a.jobId) || {}; const r = Cand.resume(s); const d = r?.data || Resume.empty();
    const ev = Cand.ev(s); const m = j.title ? Match.score(Cand.profile(s), ev, j) : { matched: [] };
    const first = String(d.summary || "").split(/(?<=\.)\s/)[0] || "";
    return `Olá, equipe de recrutamento${j.company ? " da " + j.company : ""}.\n\nMeu nome é ${s.name} e tenho interesse na vaga de ${j.title || a.jobTitle || "a vaga anunciada"}.${first ? " " + first : ""}\n\n${m.matched.length ? `Destaco experiência em ${m.matched.slice(0, 3).join(", ").toLowerCase()}.\n\n` : ""}Envio meu currículo em anexo e fico à disposição para conversar.\n\nAtenciosamente,\n${s.name}\n${s.email}`;
  },
  replyDraft(s, a, type) {
    const j = Repo.get("jobs", a.jobId) || {}; const who = j.company ? `equipe da ${j.company}` : "equipe";
    const t = { convite: `Olá, ${who}.\n\nObrigado pelo convite para a entrevista da vaga de ${j.title || "a vaga"}. Confirmo minha participação na data e horário indicados.\n\nAtenciosamente,\n${s.name}`, docs: `Olá, ${who}.\n\nObrigado pelo retorno. Segue o que foi solicitado para a vaga de ${j.title || "a vaga"}. Se precisarem de mais alguma informação, fico à disposição.\n\nAtenciosamente,\n${s.name}`, recusa: `Olá, ${who}.\n\nObrigado pelo retorno sobre a vaga de ${j.title || "a vaga"}. Fico à disposição para futuras oportunidades.\n\nAtenciosamente,\n${s.name}`, outra: `Olá, ${who}.\n\nObrigado pelo contato sobre a vaga de ${j.title || "a vaga"}.\n\nAtenciosamente,\n${s.name}` };
    return t[type] || t.outra;
  },
};

const Adm = {
  candidates() { return Repo.find("users", u => u.role === "candidate"); },
  dist(list, key, label = x => x) { const m = {}; list.forEach(u => { const k = u[key] ?? null; const kk = k === null || k === "" ? "Não informado" : label(k); m[kk] = (m[kk] || 0) + 1; }); return Object.entries(m).sort((a, b) => (a[0] === "Não informado") - (b[0] === "Não informado") || b[1] - a[1]); },

};

function draftFromJobs(jobs, channel) {
  const slides = [`Vagas da semana em ${[...new Set(jobs.map(j => j.city))].join(", ")}`];
  jobs.forEach(j => slides.push(`${j.title}\n${j.company} · ${j.city} · ${j.modality}\nO que pedem: ${(j.requirements || []).slice(0, 2).join("; ")}\nVerificada em ${U.fmtDate(j.lastCheckedAt)}`));
  slides.push("Antes de se candidatar: ajuste o currículo para cada vaga, sem inventar experiência.\nLinks e datas na legenda.");
  const caption = `Separamos ${jobs.length} vaga(s) verificada(s) para quem está começando na área jurídica.\n\n${jobs.map(j => `• ${j.title} — ${j.company} (${j.city})\n  Fonte: ${j.source}${j.url ? " · " + j.url : " · vaga demonstrativa"}\n  Verificada em ${U.fmtDate(j.lastCheckedAt)}`).join("\n")}\n\nO Manda Vaga não representa as empresas. Confira sempre o anúncio original.`;
  return { title: `${channel}: ${jobs.length} vaga(s) — ${U.fmtDate(U.now())}`, channel, jobIds: jobs.map(j => j.id), slides, caption, sources: jobs.map(j => ({ id: j.id, source: j.source, url: j.url, checked: j.lastCheckedAt })), status: "Rascunho", notes: "", reviewer: "" };
}

const passHash = p => U.hash("mv-demo-salt:" + p); // protótipo local; produção usa autenticação no servidor
const val = (id) => (document.getElementById(id)?.value ?? "").trim();
const lines = (t) => String(t || "").split("\n").map(x => x.trim()).filter(Boolean);
const me = () => App.session();

function startSession(u) { Repo.data.session = u.id; u.lastActiveAt = U.now(); Repo.save(); audit("Login", u.id, u.role); App.route = { page: u.role === "admin" ? "admin.dashboard" : "cand.home", params: {} }; applyTheme(); App.render(); }
function applyTheme() { const s = me(); const t = s ? Repo.setting("theme_" + s.id, "system") : "system"; if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

function collectResume(form) {
  const d = Resume.empty();
  d.headline = val("rs-headline"); d.summary = val("rs-summary");
  form.querySelectorAll("[data-exp]").forEach((fs, i) => d.experiences.push({ id: fs.dataset.exp, org: val(`ex-org-${i}`), role: val(`ex-role-${i}`), start: val(`ex-start-${i}`), end: val(`ex-end-${i}`), activities: lines(val(`ex-act-${i}`)) }));
  form.querySelectorAll("[data-edu]").forEach((fs, i) => d.education.push({ id: fs.dataset.edu, course: val(`ed-course-${i}`), institution: val(`ed-inst-${i}`), status: val(`ed-status-${i}`), end: val(`ed-end-${i}`) }));
  d.skills = lines(val("rs-skills")); d.certifications = lines(val("rs-certs"));
  d.languages = lines(val("rs-langs")).map(l => { const [lang, level] = l.split(/\s*[—–:-]\s*/); return { lang, level: level || "nível a confirmar" }; });
  d.extra = val("rs-extra");
  return d;
}
function sectionChanges(a, b) {
  const out = []; const T = x => JSON.stringify(x);
  [["headline", "Título"], ["summary", "Resumo"], ["experiences", "Experiências"], ["education", "Formação"], ["skills", "Competências"], ["certifications", "Cursos"], ["languages", "Idiomas"], ["extra", "Informações adicionais"]].forEach(([k, l]) => { if (T(a?.[k] ?? "") !== T(b[k] ?? "")) out.push({ field: l, before: "", after: "", reason: "Edição manual" }); });
  return out;
}
function saveResumeData(s, data, label, changes, extra = {}) {
  let r = Cand.resume(s);
  if (r) Repo.update("resumes", r.id, Object.assign({ data, status: "rascunho" }, extra));
  else r = Repo.insert("resumes", Object.assign({ userId: s.id, sourceType: "manual", status: "rascunho", data, dismissed: [] }, extra));
  Cand.saveVersion(s, data, label, changes);
  return r;
}

  claimTerm(el) {

    App.modal({ title: `“${term}”: onde você usou?`, body: `<p class="small muted">Só entra como competência se você descrever onde usou. Sem descrição, fica como “precisa de confirmação” e não conta na pontuação.</p>${C.field("kc-ev", "Onde e como você usou", C.textarea("kc-ev", cl?.evidence || "", 'rows="3" placeholder="Ex.: na Contábil Bela Vista, controlava prazos de clientes no CPJ"'))}<label class="check"><input type="checkbox" id="kc-true"> Confirmo que é verdade e consigo explicar numa entrevista.</label><label class="check"><input type="checkbox" id="kc-add"> Adicionar “${e(term)}” às competências do currículo.</label>`, actions: [{ key: "cancel", label: "Cancelar" }, { key: "ok", label: "Salvar", cls: "btn-primary" }], onAction: k => {

  App.toast(`${added} importada(s), ${dup} duplicada(s), ${skipped} sem link válido.`); App.render(); return true;
}

const Forms = {
  async login(f) { const email = val("li-email").toLowerCase(); const u = Repo.one("users", x => x.email.toLowerCase() === email); if (!u || !u.passwordHash || u.passwordHash !== await passHash(val("li-pass"))) return App.toast("E-mail ou senha incorretos.", true); if (u.status !== "ativo") return App.toast("Conta suspensa.", true); startSession(u); },
  async signup(f) {
    const name = val("su-name"), email = val("su-email").toLowerCase(), pass = val("su-pass");
    if (name.length < 3) return App.toast("Informe seu nome completo.", true);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return App.toast("E-mail inválido.", true);
    if (pass.length < 8) return App.toast("A senha precisa de 8 caracteres ou mais.", true);
    if (!document.getElementById("su-terms").checked) return App.toast("É preciso aceitar os termos para criar a conta.", true);
    if (Repo.one("users", u => u.email.toLowerCase() === email)) return App.toast("Já existe conta com esse e-mail. Entre ou recupere a senha.", true);
    const u = Repo.insert("users", { name, email, passwordHash: await passHash(pass), role: "candidate", status: "ativo", city: val("su-city"), uf: val("su-uf"), origin: val("su-origin") || null, area: null, ageRange: null, consents: { terms: true, termsAt: U.now(), marketing: document.getElementById("su-mkt").checked, whatsapp: document.getElementById("su-wa").checked }, lastActiveAt: U.now() });
    Repo.insert("subscriptions", { userId: u.id, plan: "gratis", status: "ativa", startedAt: U.now(), simulated: true });
    Repo.insert("notification_preferences", { userId: u.id, inApp: true, email: false, whatsapp: document.getElementById("su-wa").checked, frequency: "diária" });
    Cand.profile(u);
    notify(u.id, "Bem-vindo ao Manda Vaga", "Comece pelo currículo: é ele que define as vagas que você vai receber.", "ok", "cand.resume");
    audit("Cadastro", u.id); startSession(u);
  },
  async forgot(f) {
    if (!App.ui.forgotCode) { const email = val("fg-email").toLowerCase(); const u = Repo.one("users", x => x.email.toLowerCase() === email); App.ui.forgotEmail = email; if (!u) return App.toast("Se o e-mail existir, um código será gerado.", false); App.ui.forgotCode = String(Math.floor(100000 + Math.random() * 900000)); return App.render(); }
    if (val("fg-code") !== App.ui.forgotCode) return App.toast("Código incorreto.", true);
    if (val("fg-pass").length < 8) return App.toast("A nova senha precisa de 8 caracteres ou mais.", true);
    const u = Repo.one("users", x => x.email.toLowerCase() === App.ui.forgotEmail); Repo.update("users", u.id, { passwordHash: await passHash(val("fg-pass")) }); audit("Senha redefinida", u.id); App.ui.forgotCode = null; App.toast("Senha alterada. Entre com a nova senha."); App.go("login");
  },
  profile(f) {
    const s = me(); const p = Cand.profile(s); const fd = new FormData(f);
    const email = val("pf-email").toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return App.toast("E-mail inválido.", true);
    if (Repo.one("users", u => u.id !== s.id && u.email.toLowerCase() === email)) return App.toast("E-mail já usado por outra conta.", true);
    const famNames = fd.getAll("pf-fam");
    Repo.update("users", s.id, { name: val("pf-name") || s.name, email, city: val("pf-city"), uf: val("pf-uf").toUpperCase(), ageRange: val("pf-age") || null, consents: Object.assign({}, s.consents, { marketing: !!fd.get("cs-mkt") }) });
    Repo.update("profiles", p.id, { city: val("pf-city"), uf: val("pf-uf").toUpperCase(), city2: val("pf-city2"), availability: val("pf-avail"), course: val("pf-course"), semester: +val("pf-sem") || null, careerStage: val("pf-stage") || null, salaryMin: +val("pf-salary") || null, targetRoles: lines(val("pf-roles")), families: FAMILIES.filter(x => famNames.includes(x.name)).map(x => x.key), modalities: fd.getAll("pf-mod"), levels: fd.getAll("pf-lvl"), minScore: +val("pf-min") });
    const np = Repo.one("notification_preferences", x => x.userId === s.id); const pref = { inApp: !!fd.get("np-inapp"), email: !!fd.get("np-email"), whatsapp: !!fd.get("np-wa") };
    if (np) Repo.update("notification_preferences", np.id, pref); else Repo.insert("notification_preferences", { userId: s.id, ...pref });
    App.toast(pref.email || pref.whatsapp ? "Perfil salvo. Consentimento registrado; envios externos começam quando a integração for conectada." : "Perfil salvo."); App.render();
  },
  resume(f) {
    const s = me(); const d = collectResume(f); const r = Cand.resume(s);
    const bad = d.experiences.filter(x => !x.org || !x.role); if (bad.length) return App.toast("Cada experiência precisa de empresa e cargo.", true);
    const badY = d.experiences.filter(x => x.start && !Resume.year(x.start)); if (badY.length) return App.toast("Use o ano com 4 dígitos no início das experiências.", true);
    const ch = sectionChanges(r?.data, d);
    if (r && !ch.length) return App.toast("Nada mudou.");
    saveResumeData(s, d, r ? "Edição manual: " + ch.map(c => c.field).join(", ") : "Versão inicial (preenchimento manual)", ch);
    App.ui.resumeDraft = null; App.toast("Currículo salvo. Nova versão no histórico."); App.render();
  },
  plans(f) { const fd = new FormData(f); const plans = Plans.list().map((p, i) => ({ ...p, price: Math.max(0, +fd.get(`pl-price-${i}`) || p.price), limit: p.key === "gratis" ? 0 : Math.max(1, Math.round(+fd.get(`pl-limit-${i}`) || p.limit)) })); Repo.setSetting("plans", plans); audit("Planos alterados", "", plans.map(p => `${p.name}:${p.limit}`).join(", ")); App.toast("Planos salvos."); App.render(); },
  weights(f) { const fd = new FormData(f); const w = {}; Object.keys(DIM_LABEL).forEach(k => w[k] = +fd.get("w-" + k)); if (!Object.values(w).some(Boolean)) return App.toast("Pelo menos uma dimensão precisa de peso.", true); Repo.setSetting("weights", w); audit("Pesos de aderência alterados", "", JSON.stringify(w)); App.toast("Pesos salvos. As pontuações já foram recalculadas."); App.render(); },
};

/* ---------------- eventos globais ---------------- */
document.addEventListener("click", ev => {
  const mb = ev.target.closest("[data-modal]");
  if (mb && App._modal) { const k = mb.dataset.modal; if (k === "close") return App.closeModal(); const r = App._modal.onAction ? App._modal.onAction(k) : true; if (r !== false && App._modal && App._modal.el.contains(mb)) App.closeModal(); return; }
  if (ev.target.dataset && ev.target.dataset.modalBg) return App.closeModal();
  const g = ev.target.closest("[data-go]");
  if (g) { ev.preventDefault(); let [page, tab] = g.dataset.go.split(":"); if (tab) App.ui.resumeTab = tab; if (page === "cand.resume" && !tab && !g.closest(".nav")) {} App.closeModal(); return App.go(page, g.dataset.id ? { id: g.dataset.id } : {}); }
  const a = ev.target.closest("[data-act]");
  if (a && Actions[a.dataset.act]) { ev.preventDefault(); Actions[a.dataset.act](a, ev); }
});
document.addEventListener("submit", ev => { const f = ev.target.closest("form[data-form]"); if (!f) return; ev.preventDefault(); Forms[f.dataset.form]?.(f); });
document.addEventListener("change", ev => { const el = ev.target.closest("[data-change]"); if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el); });
let inputTimer; document.addEventListener("input", ev => { const el = ev.target.closest("[data-input]"); if (el && Inputs[el.dataset.input]) { clearTimeout(inputTimer); inputTimer = setTimeout(() => Inputs[el.dataset.input](el), 250); } if (ev.target.id === "pf-min") Changes.rangeLabel(ev.target); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { if (App._modal) App.closeModal(); else App.closeMenu(); } });

async function seedFresh() {
  const hashes = { demo: await passHash(DEMO_PASSWORD) };
  Repo.init(buildSeed(hashes)); Repo.data.session = null; Match.dedupeAll(); Repo.save();
}
async function boot() {
  if (!Repo.load()) await seedFresh();
  if (!LocalAdapter.ok) setTimeout(() => App.toast("Este navegador bloqueou o armazenamento local. O app funciona, mas os dados somem ao fechar.", true), 400);
  const underApp = /\/app(\/|$)/.test(location.pathname); // no site, a landing fica em "/" e o app em "/app/"
  App.route = { page: Repo.data.session ? "home" : (underApp ? "login" : "landing"), params: {} };
  applyTheme(); App.render();
  quickLogin();
}
// atalhos de demonstração: /app/#entrar-admin, #entrar-candidato e #entrar-novo entram sem senha (só contas demo)
function quickLogin() {
  const quick = { "#entrar-admin": "admin@demo.mandavaga", "#entrar-candidato": "camila@demo.mandavaga", "#entrar-novo": "rafael@demo.mandavaga" }[location.hash];
  if (!quick) return;
  history.replaceState(null, "", location.pathname + location.search);
  const u = Repo.one("users", x => x.email === quick);

  App.closeModal(); App.ui = {}; startSession(u);
}
window.addEventListener("hashchange", quickLogin);
boot();

/* Ações do assistente (carregado depois de 07_actions) */
function chatPush(s, userText, replies) {
  if (userText) App.ui.chat.push({ who: "me", text: userText });
  replies.forEach(m => App.ui.chat.push({ ...m, who: "bot" }));
  if (App.ui.chat.length > 60) App.ui.chat = App.ui.chat.slice(-60);
}
Object.assign(Actions, {
  chat(el) {
    const s = me(); const kind = el.dataset.kind, arg = el.dataset.arg, label = el.textContent.trim();
    if (kind === "go") { const [page, tab] = arg.split(":"); if (tab) App.ui.resumeTab = tab; return App.go(page); }
    if (kind === "app") { chatPush(s, label, []); App.render(); return Actions.openApp({ dataset: { id: arg } }); }
    const [intent, a2] = arg.split(":");
    chatPush(s, label, Assistant.reply(s, intent, a2)); App.render();
  },
  chatReset() { App.ui.chat = null; App.render(); },
});
Forms.chat = (f) => {
  const s = me(); const text = val("chat-text"); if (!text) return;
  const [intent, arg] = Assistant.parse(text);
  chatPush(s, text, Assistant.reply(s, intent, arg)); App.render();
  document.getElementById("chat-text")?.focus();
};
(function () { const base = App.render.bind(App); App.render = function () { base(); const log = document.getElementById("chat-log"); if (log) log.scrollTop = log.scrollHeight; }; })();

/* Ações do plano Max e do pagamento */
Object.assign(Actions, {
  copyCover() { const t = document.getElementById("ap-cover"); if (!t) return; navigator.clipboard?.writeText(t.value).then(() => App.toast("Mensagem copiada.")).catch(() => { t.select(); App.toast("Selecionada. Use Ctrl+C."); }); },
  sendEmail() { App.toast(Integrations.call("email").reason + " Copie a mensagem e envie pelo seu e-mail.", true); },
  markTried(el) { const a = Repo.get("applications", el.dataset.id); if (!a) return; const hist = a.history || []; hist.push({ status: "Envio tentado — sem confirmação", at: U.now(), note: "Envio facilitado: candidato informou que enviou pelo site" }); Repo.update("applications", a.id, { status: "Envio tentado — sem confirmação", next: "Registrar o protocolo ou a confirmação recebida", history: hist }); App.closeModal(); App.toast("Registrado como envio tentado. Quando chegar a confirmação, registre o protocolo."); App.render(); },
  addResponse(el) {
    const s = me(); const a = Repo.get("applications", el.dataset.id); if (!a || a.userId !== s.id) return;
    App.modal({ title: "Registrar resposta da empresa", body: `<p class="small muted">${e(Assistant.jobTitle(a))}</p><div class="form-grid">${C.field("rp-type", "Tipo", C.select("rp-type", RESP_TYPES, "convite", 'data-change="rpType"'))}${C.field("rp-channel", "Canal", C.select("rp-channel", ["E-mail", "WhatsApp", "Telefone", "Portal da vaga", "LinkedIn"], "E-mail"))}${C.field("rp-date", "Data da resposta", C.input("rp-date", U.today(), 'type="date"'))}<div class="full">${C.field("rp-summary", "Resumo do que disseram", C.textarea("rp-summary", "", 'rows="3"'))}</div></div><div id="rp-int" class="form-grid sunken">${C.field("rp-int-date", "Data da entrevista", C.input("rp-int-date", "", 'type="date"'))}${C.field("rp-int-time", "Horário", C.input("rp-int-time", "", 'type="time"'))}<div class="full">${C.field("rp-int-place", "Local ou link", C.input("rp-int-place", ""))}</div></div>`, actions: [{ key: "cancel", label: "Cancelar" }, { key: "ok", label: "Salvar resposta", cls: "btn-primary" }], onAction: k => {
      if (k !== "ok") return true;
      const type = val("rp-type"), date = val("rp-date"), channel = val("rp-channel");
      if (!date) { App.toast("Informe a data da resposta.", true); return false; }
      const patch = { responses: [...(a.responses || []), { type, channel, date, summary: val("rp-summary"), at: U.now() }], history: [...(a.history || [])] };
      let status = "Resposta recebida", next = a.next;
      if (type === "convite") { const di = val("rp-int-date"); if (!di) { App.toast("Informe a data da entrevista.", true); return false; } status = "Entrevista agendada"; patch.interview = { date: di, time: val("rp-int-time"), place: val("rp-int-place") }; next = "Preparar a entrevista"; }
      if (type === "docs") next = "Enviar os documentos ou fazer o teste pedido";
      if (type === "recusa") { status = "Processo encerrado"; next = ""; }
      if (!a.confirmed) { patch.confirmed = true; patch.confirmedAt = U.now(); patch.evidence = a.evidence || `Resposta da empresa recebida em ${U.fmtDate(date)} (${channel})`; }
      patch.status = status; patch.next = next; patch.history.push({ status, at: U.now(), note: `Resposta registrada: ${Object.fromEntries(RESP_TYPES)[type]} (${channel})` });
      Repo.update("applications", a.id, patch); notify(s.id, "Resposta registrada", `${Assistant.jobTitle(a)}: ${status}`, "ok", "cand.responses");
      const draft = MaxFeat.replyDraft(s, a, type);
      setTimeout(() => App.modal({ title: "Sugestão de resposta", body: `<p class="small muted">Revise e envie pelo mesmo canal. Nada é enviado automaticamente.</p><textarea id="rp-draft" class="textarea" rows="9">${e(draft)}</textarea>`, actions: [{ key: "copy", label: "Copiar" }, { key: "close", label: "Concluir", cls: "btn-primary" }], onAction: kk => { if (kk === "copy") { const t = document.getElementById("rp-draft"); navigator.clipboard?.writeText(t.value).then(() => App.toast("Copiado.")).catch(() => { t.select(); }); return false; } return true; } }), 30);
      App.render(); return true;
    } });
  },
});
Changes.rpType = el => document.getElementById("rp-int").classList.toggle("hidden", el.value !== "convite");

/* ---------- pagamento real (Asaas) quando o servidor estiver configurado ---------- */
const Payments = {
  _cfg: null,
  async config() {
    if (this._cfg) return this._cfg;
    if (!/^https?:$/.test(location.protocol) || /claude\.ai|claudeusercontent/.test(location.hostname)) return (this._cfg = { payments: false });
    try { const r = await fetch("/api/config", { cache: "no-store" }); this._cfg = r.ok ? await r.json() : { payments: false }; } catch (e) { this._cfg = { payments: false }; }
    return this._cfg;
  },
  ref(s) { if (!s.paymentRef) { const b = new Uint8Array(16); crypto.getRandomValues(b); Repo.update("users", s.id, { paymentRef: [...b].map(x => x.toString(16).padStart(2, "0")).join("") }); } return Repo.get("users", s.id).paymentRef; },
  pending(s) { return Repo.one("subscriptions", x => x.userId === s.id && x.status === "aguardando pagamento"); },
  activate(s, pend) { Repo.find("subscriptions", x => x.userId === s.id && x.status === "ativa").forEach(x => { x.status = "encerrada"; x.endedAt = U.now(); }); pend.status = "ativa"; pend.startedAt = U.now(); Repo.save(); audit("Assinatura ativada (Asaas)", s.id, pend.plan); notify(s.id, "Pagamento confirmado", `Plano ${Plans.list().find(p => p.key === pend.plan)?.name} ativo.`, "ok", "cand.plan"); },
};
const _simulatedChangePlan = Actions.changePlan;
Object.assign(Actions, {
  async changePlan(el) {
    const s = me(); const p = Plans.list().find(x => x.key === el.dataset.v);
    const cfg = await Payments.config();
    if (!cfg.payments || !p.price) return _simulatedChangePlan(el);
    App.modal({ title: `Assinar o plano ${p.name}`, body: `<p>${U.money(p.price)} por mês. Você paga na página segura da Asaas, com Pix, boleto ou cartão.</p>${C.field("pg-doc", "CPF ou CNPJ (exigido para emitir a cobrança)", C.input("pg-doc", "", 'inputmode="numeric" autocomplete="off"'))}${C.field("pg-phone", "Celular (opcional)", C.input("pg-phone", "", 'inputmode="tel"'))}<p class="xs muted">O plano é ativado assim que a Asaas confirmar o pagamento.</p>`, actions: [{ key: "cancel", label: "Cancelar" }, { key: "ok", label: "Gerar cobrança", cls: "btn-primary" }], onAction: k => {
      if (k !== "ok") return true;
      const doc = val("pg-doc").replace(/\D/g, ""); if (![11, 14].includes(doc.length)) { App.toast("Informe um CPF (11 dígitos) ou CNPJ (14 dígitos).", true); return false; }
      const ref = Payments.ref(s);
      fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plan: p.key, name: s.name, email: s.email, cpfCnpj: doc, phone: val("pg-phone"), ref }) })
        .then(r => r.json().then(b => ({ ok: r.ok, b })))
        .then(({ ok, b }) => {
          if (!ok) return App.toast(b.error || "Não foi possível gerar a cobrança.", true);
          Repo.remove("subscriptions", x => x.userId === s.id && x.status === "aguardando pagamento");
          Repo.insert("subscriptions", { userId: s.id, plan: p.key, status: "aguardando pagamento", ref, asaasSubscriptionId: b.subscriptionId, invoiceUrl: b.invoiceUrl || "" });
          audit("Cobrança criada (Asaas)", s.id, p.name); App.render(); Actions.payInfo();
        }).catch(() => App.toast("Sem conexão com o servidor de pagamentos.", true));
      return true;
    } });
  },
  payInfo() { const s = me(); const pend = Payments.pending(s); if (!pend) return; const plan = Plans.list().find(p => p.key === pend.plan); App.modal({ title: `Pagamento do plano ${plan?.name}`, body: `<p>Cobrança criada. Abra a página da Asaas para pagar com Pix, boleto ou cartão.</p>${pend.invoiceUrl ? `<a class="btn btn-primary" href="${e(pend.invoiceUrl)}" target="_blank" rel="noopener noreferrer">Abrir página de pagamento ↗</a>` : `<p class="small muted">O link ainda está sendo gerado. Clique em “Verificar pagamento” em alguns segundos.</p>`}<p class="small muted">Depois de pagar, volte aqui e clique em “Verificar pagamento”. Pix costuma confirmar em minutos; boleto pode levar até 3 dias úteis.</p>`, actions: [{ key: "close", label: "Fechar" }, { key: "check", label: "Verificar pagamento", cls: "btn-primary" }], onAction: k => { if (k === "check") { Actions.checkPayment(); } return true; } }); },
  async checkPayment() {
    const s = me(); const pend = Payments.pending(s); if (!pend) return;
    try {
      const r = await fetch("/api/subscription?ref=" + encodeURIComponent(pend.ref), { cache: "no-store" }); const b = await r.json();
      if (!r.ok) return App.toast(b.error || "Não foi possível verificar.", true);
      if (b.invoiceUrl && !pend.invoiceUrl) { pend.invoiceUrl = b.invoiceUrl; Repo.save(); }
      if (b.status === "ACTIVE") { Payments.activate(s, pend); App.toast("Pagamento confirmado. Plano ativo!"); }
      else if (b.status === "CANCELED") { pend.status = "cancelada"; Repo.save(); App.toast("A cobrança foi cancelada.", true); }
      else App.toast(b.status === "OVERDUE" ? "Cobrança vencida. Abra a página de pagamento para gerar uma nova." : "Ainda aguardando a confirmação da Asaas.");
      App.render();
    } catch (e) { App.toast("Sem conexão com o servidor de pagamentos.", true); }
  },
});
